let showRock     = true;    // reference rock visible? (stored under ROCK_KEY, not in the model save)
try { showRock = localStorage.getItem(ROCK_KEY) !== "0"; } catch (e) { /* storage blocked */ }

// Orbit camera around `target` at `dist`; yaw spins around Z, pitch tilts up/down.
const cam = { yaw: 0.6, pitch: 0.45, dist: 3.4, target: [0, 0, 0.5] };


//----- Undo + Autosave -----||
function snapshot() { return JSON.stringify(mesh); }

function pushUndo(snap = snapshot()) {
  undoStack.push(snap);
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  updateUI();
}

function undo() {
  if (!undoStack.length) return;
  mesh = JSON.parse(undoStack.pop());
  if (selection().some(i => i >= vertCount())) clearSelection();
  meshChanged();
}

function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 2, mesh, currentColor, snapOn, bakeOn, modelName }));
  } catch (e) { /* storage full or blocked (private mode): ignore */ }
}

// Old saves stored a palette index (0..15) per face: turn those into RGB.
function upgradeColors(m) {
  m.colors = m.colors.map(c => Number.isInteger(c) ? DEFAULT_PALETTE[c & 15].slice() : c);
}

function validMesh(m) {
  return m && Array.isArray(m.positions) && Array.isArray(m.tris) && Array.isArray(m.colors)
    && m.positions.length % 3 === 0 && m.tris.length % 3 === 0
    && m.colors.length === m.tris.length / 3
    && m.colors.every(c => Number.isInteger(c) || (Array.isArray(c) && c.length === 3 && c.every(isFinite)))
    && m.tris.every(i => Number.isInteger(i) && i >= 0 && i < m.positions.length / 3);
}

function load() {
  try {
    let d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!d) {
      // One-time upgrade from v1 (Y-up, cube centred on 0): rotate into Z-up and lift
      // by 0.5 so the base sits on z = 0. (x, y, z)_old -> (x, -z, y + 0.5)_new.
      const old = JSON.parse(localStorage.getItem(OLD_SAVE_KEY));
      if (old && old.v === 1 && validMesh(old.mesh)) {
        const P = old.mesh.positions, out = [];
        for (let i = 0; i < P.length; i += 3) out.push(P[i], -P[i+2], P[i+1] + 0.5);
        old.mesh.positions = out;
        old.mesh.mirror = null;
        upgradeColors(old.mesh);
        d = { v: 2, mesh: old.mesh, currentColor: old.currentColor, snapOn: old.snapOn };
      }
    }
    if (!d || d.v !== 2) return;
    if (validMesh(d.mesh)) {
      upgradeColors(d.mesh);
      mesh = d.mesh;
      if (mesh.mirror !== "x" && mesh.mirror !== "y") mesh.mirror = null;
      // Always re-pair twins from positions instead of trusting the saved partner list:
      // an older save can carry a stale or empty list, and then twins silently don't move.
      pairMirror(mesh);
    }
    if (Number.isInteger(d.currentColor)) currentColor = DEFAULT_PALETTE[d.currentColor & 15].slice();
    else if (Array.isArray(d.currentColor) && d.currentColor.length === 3) currentColor = d.currentColor;
    snapOn = !!d.snapOn;
    if (typeof d.bakeOn === "boolean") bakeOn = d.bakeOn;
    if (typeof d.modelName === "string") modelName = cIdent(d.modelName);
  } catch (e) { /* corrupt save: start fresh */ }
}

// Call after any edit: rebuild GPU buffers, save, refresh labels.
function meshChanged() {
  meshDirty = true;
  save();
  updateUI();
}


//----- WebGL Setup -----||
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl2", { antialias: true });
if (!gl) {
  document.getElementById("info").textContent = "WebGL 2 is not available in this browser.";
  throw new Error("WebGL2 unavailable");
}

// Compile one shader stage; throws with the driver's log if it fails.
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

// Link a vertex + fragment shader into a program. The stages can be deleted once linked.
function makeProgram(vsSrc, fsSrc) {
  const vs = compile(gl.VERTEX_SHADER, vsSrc), fs = compile(gl.FRAGMENT_SHADER, fsSrc);
  const p = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, fs);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  gl.deleteShader(vs); gl.deleteShader(fs);
  return p;
}

// One shader for everything, with the same inputs as the game's: pos3 + color3, no
// lighting (light is baked into the colours on the CPU). So the preview matches the game.
// Extras for the editor only: alpha (mirror plane), point size and round dots.
const prog = makeProgram(`#version 300 es
layout(location = 0) in vec3 aPos;
layout(location = 1) in vec3 aColor;
uniform mat4 uMVP;
uniform float uPointSize;
out vec3 vColor;
void main() {
  vColor = aColor;
  gl_Position = uMVP * vec4(aPos, 1.0);
  gl_PointSize = uPointSize;
}`, `#version 300 es
precision mediump float;
in vec3 vColor;
uniform bool uRoundPoints;
uniform float uAlpha;
out vec4 fragColor;
void main() {
  // Points are squares by default; throw away the corners to get round dots.
  if (uRoundPoints && length(gl_PointCoord - 0.5) > 0.5) discard;
  fragColor = vec4(vColor, uAlpha);
}`);

const U = {
  mvp:   gl.getUniformLocation(prog, "uMVP"),
  size:  gl.getUniformLocation(prog, "uPointSize"),
  round: gl.getUniformLocation(prog, "uRoundPoints"),
  alpha: gl.getUniformLocation(prog, "uAlpha"),
};

// A "draw batch" = one VAO + one VBO + a vertex count. Layout is the game's:
// 6 floats per vertex (x, y, z, r, g, b), stride 6 * 4 = 24 bytes.
function makeBatch() {
  const vao = gl.createVertexArray(), vbo = gl.createBuffer();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);    // position
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);   // colour
  gl.bindVertexArray(null);
  return { vao, vbo, count: 0 };
}

function uploadBatch(batch, data) {
  gl.bindBuffer(gl.ARRAY_BUFFER, batch.vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.DYNAMIC_DRAW);
  batch.count = data.length / 6;
}

const faceBatch  = makeBatch();
const edgeBatch  = makeBatch();
const dotBatch   = makeBatch();
const gridBatch  = makeBatch();
const planeBatch = makeBatch();
const rockBatch  = makeBatch();   // reference rock: uploaded once, never rebuilt
const gizmoBatch = makeBatch();   // axis handle shafts (thick quads), rebuilt every frame
const gizmoTips  = makeBatch();   // axis handle tip balls (big round points)
const gizmoGuide = makeBatch();   // thin line along the axis being dragged
let meshDirty = true;

// The rock goes up once, shifted by ROCK_OFFSET so it stands beside the cube.
uploadBatch(rockBatch, GAME_ROCK.map((v, i) => (i % 6) < 3 ? v + ROCK_OFFSET[i % 6] : v));

// Ground grid on the XY plane at z = 0, with the X axis red and the Y axis green.
(function buildGrid() {
  const d = [], n = 8, s = 0.25, e = n * s, g = [0.24, 0.25, 0.31];
  for (let i = -n; i <= n; i++) {
    const cy = i === 0 ? [0.35, 0.8, 0.4] : g;   // line along Y (x = i*s); green at x = 0
    const cx = i === 0 ? [0.9, 0.3, 0.3] : g;    // line along X (y = i*s); red at y = 0
    d.push(i*s, -e, 0, ...cy,  i*s, e, 0, ...cy);
    d.push(-e, i*s, 0, ...cx,  e, i*s, 0, ...cx);
  }
  uploadBatch(gridBatch, d);
})();

// Turn the mesh into GPU vertex data. Faces are "un-indexed": every triangle gets its
// own 3 vertices so it can carry its own colour (exactly what the export produces).
function rebuildBuffers() {
  const faces = [];
  for (let t = 0; t < triCount(); t++) {
    const c = triColor(t);
    for (let k = 0; k < 3; k++) faces.push(...getVert(mesh.tris[t*3 + k]), ...c);
  }
  uploadBatch(faceBatch, faces);

  const lines = [];
  for (const [a, b] of uniqueEdges()) lines.push(...getVert(a), 0.08, 0.08, 0.1,  ...getVert(b), 0.08, 0.08, 0.1);
  uploadBatch(edgeBatch, lines);

  // Dot colours: selected = yellow, its mirror partner = orange,
  // unpaired (mirror on but no twin) = red, everything else = white.
  // Hidden (behind the model or off screen) = a dim version, and they go in the buffer
  // first so visible dots draw on top of them where they overlap.
  const ax = axisIndex(mesh.mirror);
  const twinsOfSel = new Set(selection().map(i => mesh.partner[i]));
  const vis = vertVisibility();
  const hiddenDots = [], shownDots = [];
  for (let i = 0; i < vertCount(); i++) {
    let c = [0.95, 0.95, 1.0];
    if (ax >= 0 && mesh.partner[i] < 0) c = [1.0, 0.35, 0.3];
    if (twinsOfSel.has(i) && !isSelected(i)) c = [1.0, 0.55, 0.15];   // twin of a selected vert
    if (isSelected(i)) c = [1.0, 0.85, 0.1];                          // selected: yellow
    if (vis[i]) shownDots.push(...getVert(i), ...c);
    else hiddenDots.push(...getVert(i), ...c.map(k => 0.18 + k * 0.25));   // dim grey-ish
  }
  uploadBatch(dotBatch, hiddenDots.concat(shownDots));

  // Mirror plane: a quad on axis = 0, a bit bigger than the model on the other two axes.
  const plane = [];
  if (ax >= 0) {
    const o = [0, 1, 2].filter(k => k !== ax);    // the two axes the plane spans
    let lo = [Infinity, Infinity], hi = [-Infinity, -Infinity];
    for (let i = 0; i < vertCount(); i++) {
      const p = getVert(i);
      o.forEach((k, j) => { lo[j] = Math.min(lo[j], p[k]); hi[j] = Math.max(hi[j], p[k]); });
    }
    if (!isFinite(lo[0])) { lo = [-0.5, 0]; hi = [0.5, 1]; }
    const corner = (u, v) => { const p = [0, 0, 0]; p[o[0]] = u; p[o[1]] = v; return [...p, 0.45, 0.7, 1.0]; };
    const u0 = lo[0] - 0.25, u1 = hi[0] + 0.25, w0 = lo[1] - 0.25, w1 = hi[1] + 0.25;
    plane.push(...corner(u0, w0), ...corner(u1, w0), ...corner(u1, w1),
               ...corner(u0, w0), ...corner(u1, w1), ...corner(u0, w1));
  }
  uploadBatch(planeBatch, plane);

  meshDirty = false;
}


//----- Camera -----||
let viewW = 1, viewH = 1, dpr = 1;   // canvas size in CSS px, and device pixel ratio
let viewProj = new Float32Array(16);

// Eye position on a sphere around the target. yaw = 0 looks from -Y (the "front").
function camEye() {
  const cp = Math.cos(cam.pitch);
  return v3.add(cam.target, v3.scale([cp * Math.sin(cam.yaw), -cp * Math.cos(cam.yaw), Math.sin(cam.pitch)], cam.dist));
}

function updateCamera() {
  const proj = mat4Perspective(FOV_Y, viewW / viewH, 0.05, 100);
  const view = mat4LookAt(camEye(), cam.target, UP);
  viewProj = mat4Multiply(proj, view);
}

// World point -> screen position in CSS px. Returns null if behind the camera.
function project(p) {
  const m = viewProj;
  const x = m[0]*p[0] + m[4]*p[1] + m[8]*p[2]  + m[12];
  const y = m[1]*p[0] + m[5]*p[1] + m[9]*p[2]  + m[13];
  const w = m[3]*p[0] + m[7]*p[1] + m[11]*p[2] + m[15];
  if (w <= 1e-6) return null;
  return { x: (x / w * 0.5 + 0.5) * viewW, y: (1 - (y / w * 0.5 + 0.5)) * viewH, depth: w };
}

// Screen position (CSS px) -> ray from the eye into the scene.
function screenRay(sx, sy) {
  const eye = camEye();
  const fwd = v3.norm(v3.sub(cam.target, eye));
  const right = v3.norm(v3.cross(fwd, UP));
  const up = v3.cross(right, fwd);
  const t = Math.tan(FOV_Y / 2);
  const nx = (sx / viewW) * 2 - 1, ny = 1 - (sy / viewH) * 2;   // -1..1
  const dir = v3.norm(v3.add(fwd, v3.add(v3.scale(right, nx * t * viewW / viewH), v3.scale(up, ny * t))));
  return { origin: eye, dir, fwd };
}


//----- Selection -----||
// Tap a dot to add it to the selection, tap a selected dot to take it out again.
// `selected` is the primary (last added) vertex; `selExtra` holds the rest. The gizmo
// sits at the centroid of the whole selection and moves all of it together.
// Hidden dots can't be tapped, but if they were selected before they stay selected.
function selection() {
  if (selected < 0 || selected >= vertCount()) return [];
  const out = [selected];
  for (const i of selExtra) if (i !== selected && i < vertCount()) out.push(i);
  return out;
}
function clearSelection() { selected = -1; selExtra.clear(); }
function selectOnly(v) { selExtra.clear(); selected = v; }
function toggleSelect(v) {
  if (v === selected) {                          // remove the primary: promote another one
    const rest = [...selExtra];
    selExtra.clear();
    selected = rest.length ? rest.pop() : -1;
    for (const i of rest) selExtra.add(i);
  } else if (selExtra.has(v)) selExtra.delete(v);
  else { if (selected >= 0) selExtra.add(selected); selected = v; }
}
const isSelected = (i) => i === selected || selExtra.has(i);
function selCentroid() {
  const sel = selection();
  const c = [0, 0, 0];
  for (const i of sel) { const p = getVert(i); c[0] += p[0]; c[1] += p[1]; c[2] += p[2]; }
  return sel.length ? c.map(v => v / sel.length) : null;
}
// The vertices to move directly. If a vertex and its mirror twin are both selected,
// only one of them is moved; moveVertex() places the other as its mirror image, so the
// same delta is never applied twice.
function selDrivers() {
  const out = [], seen = new Set();
  for (const i of selection()) {
    const q = mesh.partner[i];
    if (q >= 0 && q !== i && seen.has(q)) continue;
    seen.add(i); out.push(i);
  }
  return out;
}
// Axis a is locked for the selection when every selected vertex sits on the mirror
// plane and a is the mirror axis (then nothing can move along it).
function selAxisLocked(a) {
  const sel = selection();
  return sel.length > 0 && sel.every(i => axisLocked(i, a));
}
// Move the whole selection by `delta` along axis a, from the start positions `starts`
// (Map vertex -> position). Twins follow mirrored; on-plane verts stay on the plane.
function moveSelection(starts, a, delta) {
  for (const [i, p0] of starts) {
    const np = p0.slice();
    np[a] = p0[a] + delta;
    moveVertex(i, np);
  }
}
function selStarts() { return new Map(selDrivers().map(i => [i, getVert(i)])); }


//----- Occlusion (which vertices can you actually see?) -----||
// A vertex is hidden if it's off screen / behind the camera, or if the straight line
// from the eye to it passes through one of the model's triangles first. Triangles that
// use the vertex itself are skipped (the ray always "hits" them right at the vertex).
// The rock is display only, so it never hides anything. Done on the CPU: for low-poly
// meshes that's (verts x tris) ray tests, a few tens of thousands at most.
// The result is cached and only recomputed when the camera, the canvas size, or the
// mesh changes (the key below), so a still view costs nothing.
const OCCLUDE_EPS = 1e-4;   // relative slack so a hit right at the target doesn't count
let visCache = { key: "", vis: [] };

// Is screen point s (from project()) inside the canvas? project() already rejects
// points behind the camera.
const onScreen = (s) => !!s && s.x >= 0 && s.x <= viewW && s.y >= 0 && s.y <= viewH;

// Does any triangle (except those in `skip`) sit between the eye and point p?
function occluded(eye, p, skip) {
  const toP = v3.sub(p, eye), L = v3.len(toP);
  if (L < 1e-9) return false;
  const dir = v3.scale(toP, 1 / L), limit = L * (1 - OCCLUDE_EPS) - OCCLUDE_EPS;
  for (let t = 0; t < triCount(); t++) {
    if (skip(t)) continue;
    const hit = rayTriangle(eye, dir, getVert(mesh.tris[t*3]), getVert(mesh.tris[t*3+1]), getVert(mesh.tris[t*3+2]));
    if (hit !== null && hit < limit) return true;
  }
  return false;
}

// true/false per vertex, from the cache when nothing changed.
function vertVisibility() {
  const key = [cam.yaw, cam.pitch, cam.dist, ...cam.target, viewW, viewH].join(",") + "|" +
              mesh.positions.join(",") + "|" + mesh.tris.join(",");
  if (visCache.key === key) return visCache.vis;
  updateCamera();                                  // project() must use this exact camera
  const eye = camEye(), vis = [];
  for (let i = 0; i < vertCount(); i++) {
    const p = getVert(i);
    vis.push(onScreen(project(p)) && !occluded(eye, p, (t) =>
      mesh.tris[t*3] === i || mesh.tris[t*3+1] === i || mesh.tris[t*3+2] === i));
  }
  visCache = { key, vis };
  return vis;
}

const vertVisible = (i) => !!vertVisibility()[i];

// An edge counts as visible if its midpoint is: on screen and not behind a triangle
// (skipping the triangles that contain the edge itself).
function edgeVisible(a, b) {
  const m = v3.scale(v3.add(getVert(a), getVert(b)), 0.5);
  if (!onScreen(project(m))) return false;
  return !occluded(camEye(), m, (t) => {
    const tri = mesh.tris.slice(t*3, t*3 + 3);
    return tri.includes(a) && tri.includes(b);
  });
}


//----- Picking -----||
// Nearest VISIBLE vertex whose projected dot is within TOUCH_RADIUS of the tap.
// Hidden (greyed) vertices can't be picked, so you never grab one through the model.
function pickVertex(sx, sy) {
  let best = -1, bestD = TOUCH_RADIUS, bestDepth = Infinity;
  const vis = vertVisibility();
  for (let i = 0; i < vertCount(); i++) {
    if (!vis[i]) continue;
    const s = project(getVert(i));
    if (!s) continue;
    const d = Math.hypot(s.x - sx, s.y - sy);
    // Closer on screen wins; if two are about equally close, the one nearer the camera wins.
    if (d < bestD - 2 || (Math.abs(d - bestD) <= 2 && s.depth < bestDepth)) { best = i; bestD = d; bestDepth = s.depth; }
  }
  return best;
}

// World length of one CSS pixel at view depth w (w = distance along the camera's view axis).
const worldPerPx = (w) => 2 * w * Math.tan(FOV_Y / 2) / viewH;

// The selected vertex's three axis handles, in world and screen space.
// Each: { axis, tipW (world), s0/s1 (screen origin/tip), visible, locked }.
// A handle pointing (almost) straight at the camera is too short to grab, so it's hidden.
// With mirror on, a vertex sitting on the plane can't leave it: that handle is "locked".
function gizmoHandles() {
  if (!overlayOn || mode !== "move" || !selection().length) return [];
  const p = selCentroid(), s0 = project(p);
  if (!s0) return [];
  const L = GIZMO_PX * worldPerPx(s0.depth);
  const ax = axisIndex(mesh.mirror);
  const out = [];
  for (let a = 0; a < 3; a++) {
    const tipW = p.slice(); tipW[a] += L;
    const s1 = project(tipW);
    const visible = !!s1 && Math.hypot(s1.x - s0.x, s1.y - s0.y) > 14;
    out.push({ axis: a, tipW, s0, s1, visible, locked: ax === a && selAxisLocked(a) });
  }
  return out;
}

// Which axis handle (0, 1, 2) is under the finger, or -1. Tips win over shafts.
function pickHandle(sx, sy) {
  let best = -1, bestD = Infinity;
  for (const h of gizmoHandles()) {
    if (!h.visible || h.locked) continue;
    const dTip = Math.hypot(h.s1.x - sx, h.s1.y - sy);
    let d = dTip <= GIZMO_TIP_PX ? dTip : Infinity;
    // Shaft: only its outer part, so a tap right on the vertex still grabs the vertex.
    const fromOrigin = Math.hypot(h.s0.x - sx, h.s0.y - sy);
    if (d === Infinity && fromOrigin > 16) {
      const ds = distToSegment(sx, sy, h.s0, h.s1);
      if (ds <= GIZMO_SHAFT_PX) d = ds + GIZMO_TIP_PX;   // ranked after any tip hit
    }
    if (d < bestD) { bestD = d; best = h.axis; }
  }
  return best;
}

// Closest point on the axis line (origin o, unit direction a) to a screen ray, as the
// distance s along the axis. This is what makes the vertex follow the finger exactly
// along the axis's on-screen direction. Returns null if the ray is parallel to the axis.
function axisParam(r, o, a) {
  const b = v3.dot(a, r.dir), w = v3.sub(o, r.origin);
  const denom = 1 - b * b;
  if (denom < 1e-6) return null;
  return (b * v3.dot(r.dir, w) - v3.dot(a, w)) / denom;
}

// Distance from point P to segment AB in 2D screen space.
function distToSegment(px, py, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len2 = dx*dx + dy*dy;
  let t = len2 ? ((px - a.x) * dx + (py - a.y) * dy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (a.x + t*dx), py - (a.y + t*dy));
}

// Nearest visible edge on screen within TOUCH_RADIUS. Close candidates are sorted first
// and the occlusion test (the expensive part) only runs on those, nearest first.
function pickEdge(sx, sy) {
  updateCamera();
  const near = [];
  for (const [a, b] of uniqueEdges()) {
    const pa = project(getVert(a)), pb = project(getVert(b));
    if (!pa || !pb) continue;
    const d = distToSegment(sx, sy, pa, pb);
    if (d < TOUCH_RADIUS) near.push({ e: [a, b], d });
  }
  near.sort((u, w) => u.d - w.d);
  for (const n of near) if (edgeVisible(n.e[0], n.e[1])) return n.e;
  return null;
}

// Möller–Trumbore ray/triangle test. Returns distance t along the ray, or null.
function rayTriangle(o, d, a, b, c) {
  const e1 = v3.sub(b, a), e2 = v3.sub(c, a);
  const p = v3.cross(d, e2);
  const det = v3.dot(e1, p);
  if (Math.abs(det) < 1e-9) return null;           // ray parallel to triangle
  const inv = 1 / det, s = v3.sub(o, a);
  const u = v3.dot(s, p) * inv;          if (u < 0 || u > 1) return null;
  const q = v3.cross(s, e1);
  const v = v3.dot(d, q) * inv;          if (v < 0 || u + v > 1) return null;
  const t = v3.dot(e2, q) * inv;
  return t > 1e-6 ? t : null;
}

// Nearest triangle under the tap.
function pickFace(sx, sy) {
  const r = screenRay(sx, sy);
  let best = -1, bestT = Infinity;
  for (let t = 0; t < triCount(); t++) {
    const hit = rayTriangle(r.origin, r.dir, getVert(mesh.tris[t*3]), getVert(mesh.tris[t*3+1]), getVert(mesh.tris[t*3+2]));
    if (hit !== null && hit < bestT) { bestT = hit; best = t; }
  }
  return best;
}

const snap = (p) => p.map(c => Math.round(c / SNAP_STEP) * SNAP_STEP);


//----- Input (Pointer Events: mouse, touch, and pen all in one API) -----||
const pointers = new Map();  // pointerId -> {x, y} in CSS px, relative to the canvas
let gesture = null;          // what the current gesture is doing

// gesture.kind:
//   "pending" : finger down, not yet moved past TAP_SLOP (could be a tap). If it went
//               down on a dot, `picked` is set: that dot is already selected, and the
//               release must not count as an empty-space tap.
//   "orbit"   : dragging the camera (also when the drag started on a dot)
//   "axis"    : dragging an axis handle: the vertex slides along X, Y, or Z only
//   "pinch"   : two fingers zooming
//   "idle"    : ignore until all fingers lift (e.g. after a pinch)

function localPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

canvas.addEventListener("pointerdown", (e) => {
  canvas.setPointerCapture(e.pointerId);
  const p = localPos(e);
  pointers.set(e.pointerId, p);

  // Second finger: switch to pinch zoom, whatever was happening.
  if (pointers.size === 2) {
    if (gesture && gesture.kind === "axis" && gesture.moved) meshChanged();
    const [a, b] = [...pointers.values()];
    gesture = { kind: "pinch", lastDist: Math.hypot(a.x - b.x, a.y - b.y) };
    return;
  }
  if (pointers.size > 2) return;

  gesture = { kind: "pending", startX: p.x, startY: p.y, lastX: p.x, lastY: p.y };

  // In clean preview nothing is grabbed on touch-down: the tap (on release) restores the
  // overlay, and a drag just orbits.
  if (mode === "move" && overlayOn) {
    // 1) An axis handle of the selected vertex? (Checked first: handles are the big targets.)
    const h = pickHandle(p.x, p.y);
    if (h >= 0) {
      const p0 = selCentroid(), dir = [0, 0, 0];
      dir[h] = 1;
      const s = axisParam(screenRay(p.x, p.y), p0, dir);
      gesture = { kind: "axis", starts: selStarts(), axis: h, p0, dir, sGrab: s === null ? 0 : s,
                  before: snapshot(), moved: false, startX: p.x, startY: p.y };
      updateUI();
      return;
    }
    // 2) A vertex? Remember it; on release (a tap) it's added to / removed from the
    //    selection. Touching a dot NEVER moves it (only the gizmo handles and typed
    //    coordinates do), and a drag that starts on a dot just orbits the camera.
    const v = pickVertex(p.x, p.y);
    if (v >= 0) gesture.picked = v;
  }
});

canvas.addEventListener("pointermove", (e) => {
  if (!pointers.has(e.pointerId)) return;
  const p = localPos(e);
  pointers.set(e.pointerId, p);
  if (!gesture) return;

  if (gesture.kind === "pinch" && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (d > 0 && gesture.lastDist > 0) zoomBy(gesture.lastDist / d);
    gesture.lastDist = d;
    return;
  }

  if (gesture.kind === "pending" &&
      Math.hypot(p.x - gesture.startX, p.y - gesture.startY) > TAP_SLOP) {
    gesture.kind = "orbit";
  }

  if (gesture.kind === "orbit") {
    cam.yaw   -= (p.x - gesture.lastX) * 0.01;
    cam.pitch += (p.y - gesture.lastY) * 0.01;
    cam.pitch  = Math.max(-1.55, Math.min(1.55, cam.pitch)); // stop just short of straight up/down
    gesture.lastX = p.x; gesture.lastY = p.y;
  }

  if (gesture.kind === "axis") {
    if (!gesture.moved && Math.hypot(p.x - gesture.startX, p.y - gesture.startY) < 3) return;
    const s = axisParam(screenRay(p.x, p.y), gesture.p0, gesture.dir);
    if (s === null) return;
    const a = gesture.axis, c0 = gesture.p0[a];
    let delta = s - gesture.sGrab;
    // Snap the CENTROID on the dragged axis to the grid (for one vertex that's the vertex
    // itself); every selected vertex moves by the same delta. Other axes never jump.
    if (snapOn) delta = Math.round((c0 + delta) / SNAP_STEP) * SNAP_STEP - c0;
    if (!gesture.moved) { pushUndo(gesture.before); gesture.moved = true; }   // one undo per drag
    moveSelection(gesture.starts, a, delta);       // twins follow mirrored
    meshDirty = true;
    updateUI();
  }

});

function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (!gesture) return;

  if (gesture.kind === "pinch") {
    // Lifting one of two fingers: don't let the remaining finger suddenly orbit.
    gesture = pointers.size ? { kind: "idle" } : null;
    return;
  }
  if (pointers.size) return;

  if (gesture.kind === "pending" && e.type === "pointerup") {
    if (gesture.picked !== undefined && overlayOn && mode === "move") {
      toggleSelect(gesture.picked); lastEmptyTap = null; meshDirty = true; updateUI();
    } else handleTap(gesture.startX, gesture.startY);
  }
  const wasAxis = gesture.kind === "axis";
  if (wasAxis && gesture.moved) meshChanged();
  gesture = null;
  if (wasAxis) updateUI();                         // clear the "active axis" highlight
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);

//----- Taps + Clean Preview -----||
// A tap = finger down and up without moving past TAP_SLOP (drags orbit, two fingers
// pinch; neither ever counts as a tap). Rules:
//  Overlay on:
//    Tap a dot (Move)       -> add it to the selection / remove it if already selected.
//    Single tap, empty space -> deselect all vertices, at once (overlay stays).
//    Double tap, empty space -> clean preview ("deselect the object"): second tap within
//                               DOUBLE_TAP_MS and DOUBLE_TAP_PX of the first.
//    Split: tap an edge -> split it, then switch to Move with the new vertex selected.
//    Paint: tap a face -> paint it.
//    ("Empty" = not on the model: no face under the finger. In Move mode a tap on the
//     model but not on a dot also deselects, but doesn't count toward a double tap.)
//  Clean preview (overlay off): only the shaded model (+ grid, + rock if on) is drawn.
//    Any tap brings the overlay back and does nothing else (no select, no split).
//    Exception, Paint mode: tapping a face still paints it (you see the real result),
//    and tapping empty space brings the overlay back.
const DOUBLE_TAP_MS = 300, DOUBLE_TAP_PX = 40;
let lastEmptyTap = null;   // { t, x, y } of the last single empty-space tap

function setOverlay(on) {
  if (overlayOn === on) return;
  overlayOn = on;
  if (!on) { clearSelection(); if (roEditing) closeCoordEdit(false); }
  meshDirty = true;
  updateUI();
}

function paintAt(x, y) {
  const t = pickFace(x, y);
  if (t < 0) return false;
  const targets = [t, ...mirroredTris(t)];   // just [t] when mirror is off
  if (targets.every(u => colorEq(mesh.colors[u], currentColor))) return true;
  pushUndo();
  for (const u of targets) mesh.colors[u] = currentColor.slice();
  meshChanged();
  return true;
}

// Empty-space tap: deselect now; if it's the second quick tap, go to clean preview.
function emptyTap(x, y, trulyEmpty) {
  const now = performance.now(), l = lastEmptyTap;
  if (trulyEmpty && l && now - l.t <= DOUBLE_TAP_MS && Math.hypot(x - l.x, y - l.y) <= DOUBLE_TAP_PX) {
    lastEmptyTap = null;
    setOverlay(false);
    return;
  }
  lastEmptyTap = trulyEmpty ? { t: now, x, y } : null;
  if (selection().length) { clearSelection(); meshDirty = true; updateUI(); }
}

function handleTap(x, y) {
  if (!overlayOn) {
    lastEmptyTap = null;
    if (mode === "paint" && paintAt(x, y)) return;
    setOverlay(true);                       // model, dot, edge, or empty: show it again
    return;
  }
  if (mode === "move") {
    emptyTap(x, y, pickFace(x, y) < 0);
  } else if (mode === "split") {
    const edge = pickEdge(x, y);
    if (edge) {
      // Split, then jump straight to Move with the new vertex selected so its gizmo is
      // ready to drag. splitEdgeMirrored returns the vertex on the edge you tapped (its
      // mirror twin, if one was made, is the orange dot).
      pushUndo();
      selectOnly(splitEdgeMirrored(edge[0], edge[1]));
      mode = "move";
      overlayOn = true;
      lastEmptyTap = null;
      meshChanged();
    } else emptyTap(x, y, pickFace(x, y) < 0);
  } else if (mode === "paint") {
    if (paintAt(x, y)) lastEmptyTap = null;
    else emptyTap(x, y, true);
  }
}

function zoomBy(factor) {
  cam.dist = Math.max(0.6, Math.min(30, cam.dist * factor));
}
canvas.addEventListener("wheel", (e) => { e.preventDefault(); zoomBy(Math.exp(e.deltaY * 0.001)); }, { passive: false });

// Block iOS Safari's own pinch-zoom / double-tap gestures on the page.
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => { if (e.target === canvas) e.preventDefault(); }, { passive: false });
canvas.addEventListener("contextmenu", (e) => e.preventDefault());


//----- Export -----||
// Turn any text into a valid C identifier: letters/digits/underscore only, no leading digit.
function cIdent(s) {
  let id = String(s).trim().replace(/[^A-Za-z0-9_]+/g, "_").replace(/^_+|_+$/g, "");
  if (!id) id = "model";
  if (/^[0-9]/.test(id)) id = "_" + id;
  return id;
}

const f4 = (x) => (Math.abs(x) < 5e-5 ? 0 : x).toFixed(4) + "f";
const f3 = (x) => x.toFixed(3) + "f";

// Output matches the pofa renderer: 6 floats per vertex (pos3 Z-up + color3 0..1),
// 3 vertices per triangle, CCW from outside, ready for glDrawArrays(GL_TRIANGLES).
function buildExport() {
  const name = cIdent(modelName);
  const nVerts = triCount() * 3;
  const L = [];
  L.push(`// ${name}: ${triCount()} triangles, ${nVerts} verts (exported from Vert Modeler)`);
  L.push(`// layout per vertex: pos3 (x, y, z in Z-up world units) + color3 (r, g, b in 0..1)`);
  L.push(`//   6 floats, stride 6*sizeof(float); 3 verts per triangle, CCW seen from outside`);
  L.push(`//   base sits on z = 0; lighting ${bakeOn ? "baked into colors (0.55 + 0.45*max(0, n.(0.3,0.5,0.8)))" : "not baked (flat palette colors)"}`);
  L.push(`// usage: mesh_upload(&g_mesh, ${name}_verts, ${name}_vert_count);`);
  L.push(`static const float ${name}_verts[] = {`);
  for (let t = 0; t < triCount(); t++) {
    const c = triColor(t);
    for (let k = 0; k < 3; k++) {
      const p = getVert(mesh.tris[t*3 + k]);
      L.push(`    ${p.map(f4).join(", ")},  ${c.map(f3).join(", ")},`);
    }
  }
  L.push(`};`);
  L.push(`static const int ${name}_vert_count = ${nVerts};`);
  L.push(``);
  return L.join("\n") + "\n";
}

// Clipboard API needs a secure context (https or localhost); file:// may refuse,
// so fall back to the old select-and-execCommand trick on a hidden textarea.
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) { /* fall through */ }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}

let toastTimer = 0;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

async function doExport() {
  $("exportName").value = modelName;
  const text = buildExport();
  $("exportText").value = text;
  $("modal").classList.add("show");
  const ok = await copyText(text);
  toast(ok ? "Copied to clipboard" : "Tap Copy, or select the text");
}


//----- Import -----||
// Paste text from a previous export and get an editable mesh back.
//  1. Name: "<name>_verts" -> modelName.
//  2. Numbers: everything inside the braces of the _verts[] array (or the whole text if
//     there are no braces), with comments removed; "1.0f", "-.5", "2e-3" all parse.
//  3. Every 6 numbers = one vertex (x, y, z, r, g, b); every 3 vertices = one triangle.
//  4. Weld: vertices whose positions are within WELD_EPS share one index, so moving a
//     corner moves every triangle that touches it (like the cube you started with).
//  5. Colours are kept EXACTLY. If the export had Shade on, the light was multiplied in,
//     so we divide it back out (and turn Shade on) so re-exporting prints the same
//     numbers. Which one? The export's own comment says "baked into colors" or "not
//     baked"; for bare numbers we guess by which reading matches palette colours more
//     (tie = flat, which is always exact). Colours that aren't in the active palette
//     are added to a palette called "Imported" so you can paint with them again.
// The editor's faces are triangles, so no quad merging is needed.
function parseExport(text) {
  const nameMatch = text.match(/([A-Za-z_][A-Za-z0-9_]*)_verts\s*\[/);
  let body = text;
  const open = nameMatch ? text.indexOf("{", nameMatch.index) : text.indexOf("{");
  if (open >= 0) {
    const close = text.indexOf("}", open);
    body = text.slice(open + 1, close >= 0 ? close : undefined);
  }
  body = body.replace(/\/\*[\s\S]*?\*\//g, " ").replace(/\/\/[^\n]*/g, " ");
  const nums = (body.match(/[-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?/g) || []).map(Number);
  if (nums.length < 18) throw new Error("Need at least one triangle (18 numbers), found " + nums.length + ".");
  if (nums.length % 18) throw new Error(nums.length + " numbers isn't a whole number of triangles (6 per vertex, 3 vertices each).");
  if (nums.some(n => !isFinite(n))) throw new Error("Found a number that isn't finite.");
  const lighting = /baked into colors/.test(text) ? "baked" : /not baked/.test(text) ? "flat" : null;
  return { name: nameMatch ? nameMatch[1] : null, nums, lighting };
}

function importMesh(nums, mirror, lighting = null) {
  // Weld through a hash grid: each position goes in a cell of size WELD_EPS; we check the
  // 27 neighbouring cells so two points either side of a cell border still merge.
  const positions = [], cells = new Map(), corner = [];
  const cellKey = (a, b, c) => a + "," + b + "," + c;
  function weld(p) {
    const c = p.map(v => Math.round(v / WELD_EPS));
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
      const list = cells.get(cellKey(c[0] + dx, c[1] + dy, c[2] + dz));
      if (!list) continue;
      for (const i of list)
        if (Math.abs(positions[i*3] - p[0]) <= WELD_EPS && Math.abs(positions[i*3+1] - p[1]) <= WELD_EPS &&
            Math.abs(positions[i*3+2] - p[2]) <= WELD_EPS) return i;
    }
    const i = positions.length / 3;
    positions.push(p[0], p[1], p[2]);
    const k = cellKey(c[0], c[1], c[2]);
    if (!cells.has(k)) cells.set(k, []);
    cells.get(k).push(i);
    return i;
  }
  const tris = [], rgb = [];
  for (let t = 0; t < nums.length / 18; t++) {
    const idx = [0, 1, 2].map(k => weld(nums.slice(t*18 + k*6, t*18 + k*6 + 3)));
    if (idx[0] === idx[1] || idx[1] === idx[2] || idx[0] === idx[2]) continue;   // degenerate
    tris.push(...idx);
    // Triangle colour = average of its 3 vertex colours (they're equal in our exports).
    rgb.push([3, 4, 5].map(k => (nums[t*18 + k] + nums[t*18 + 6 + k] + nums[t*18 + 12 + k]) / 3));
  }
  if (!tris.length) throw new Error("Every triangle was degenerate (zero area).");
  const m = { positions, tris, colors: [], partner: [], mirror };

  const normal = (t) => {
    const P = (i) => positions.slice(i*3, i*3 + 3);
    const a = P(tris[t*3]), b = P(tris[t*3+1]), c = P(tris[t*3+2]);
    return v3.norm(v3.cross(v3.sub(b, a), v3.sub(c, a)));
  };
  const nT = tris.length / 3;
  const unbaked = rgb.map((c, t) => { const k = bakeFactor(normal(t)); return c.map(v => v / k); });
  let useBaked = lighting === "baked";
  if (lighting === null) {
    // Guess: count faces whose colour is a palette colour under each reading.
    const known = allPalettes().flatMap(p => p.colors);
    const hits = (list) => list.filter(c => known.some(k => colorEq(k, c, 0.0026))).length;
    useBaked = hits(unbaked) > hits(rgb);
  }
  m.colors = (useBaked ? unbaked : rgb).map(c => c.slice());
  pairMirror(m);
  return { mesh: m, baked: useBaked, dropped: nums.length / 18 - nT };
}

function openImport() {
  $("importText").value = "";
  $("importModal").classList.add("show");
  setTimeout(() => $("importText").focus(), 50);
}

function doImport(text) {
  let parsed, res;
  try {
    parsed = parseExport(text);
    res = importMesh(parsed.nums, mesh.mirror, parsed.lighting);
  } catch (e) { toast("Import failed: " + e.message); return false; }
  pushUndo();                                      // the old model, so Undo brings it back
  mesh = res.mesh;
  bakeOn = res.baked;
  if (parsed.name) modelName = cIdent(parsed.name);
  clearSelection();
  meshChanged();
  const notes = [`${vertCount()} verts, ${triCount()} tris`];
  const added = addToImportedPalette(mesh.colors);
  if (added) notes.push(`${added} new colour${added > 1 ? "s" : ""} added to the "Imported" palette`);
  if (res.dropped) notes.push(`${res.dropped} zero-area tris dropped`);
  if (mesh.mirror && unpairedCount()) notes.push(`${unpairedCount()} verts have no mirror twin`);
  toast(`Imported ${modelName}: ` + notes.join(", "));
  return true;
}


//----- UI Wiring -----||
function $(id) { return document.getElementById(id); }

// (v6: the hint line and the "verts · tris · mirror" info bar at the top are gone, per
// Nathan's request. Mirror problems now show up as a one-off toast when they appear.)
let lastWarn = { nv: 0, nt: 0 };

function updateUI() {
  for (const b of document.querySelectorAll("[data-mode]")) b.classList.toggle("on", b.dataset.mode === mode);
  $("bSnap").classList.toggle("on", snapOn);
  $("bRock").classList.toggle("on", showRock);

  $("bSym").disabled = !mesh.mirror;

  // Dissolve works on exactly one vertex (with several selected it's disabled).
  $("bDissolve").disabled = !(mode === "move" && selection().length === 1);
  $("palette").classList.toggle("show", mode === "paint");
  renderPalette();

  if (selected >= vertCount()) selected = -1;       // e.g. after a test or tool shrank the mesh
  if (selected < 0) selExtra.clear();
  mirrorWarnings();
  updateStats();
  updateReadout();
}

// Stats line, based on the EXPORT (what the game uploads), not the editor's welded verts:
//   export verts = tris * 3 (un-indexed, one copy per triangle corner, own colour)
//   bytes        = export verts * 6 floats * 4 bytes = sizeof(<name>_verts[]) = VBO size
// Unique editor verts are shown in brackets. Hidden in clean preview with the overlay.
function updateStats() {
  const el = $("stats");
  el.classList.toggle("hide", !overlayOn);
  const tris = triCount(), verts = tris * 3, bytes = verts * 6 * 4;
  const n = (x) => x.toLocaleString("en-US");
  const nSel = selection().length;
  el.textContent = `${n(verts)} verts · ${n(tris)} tris · ${n(bytes)} B  (${n(vertCount())} unique)` +
                   (nSel > 1 ? ` · ${nSel} selected` : "");
}

// Mirror warnings as a short toast, only when a count goes from 0 to something, so a
// drag doesn't re-toast every frame. They show straight away (even mid-drag), which is
// when it's most useful to know.
function mirrorWarnings() {
  const nv = mesh.mirror ? unpairedCount() : 0, nt = mesh.mirror ? foldedTriCount() : 0;
  const msgs = [];
  if (nv && !lastWarn.nv) msgs.push(`${nv} unpaired vert${nv > 1 ? "s" : ""} (Symm fixes it)`);
  if (nt && !lastWarn.nt) msgs.push(`${nt} folded tri${nt > 1 ? "s" : ""} (split a centre edge)`);
  lastWarn = { nv, nt };
  if (msgs.length) toast("Mirror " + mesh.mirror.toUpperCase() + ": " + msgs.join(", "));
}

// Live X / Y / Z chip at the bottom of the view while a vertex is selected in Move mode.
// The axis being dragged is underlined.
function updateReadout() {
  const show = overlayOn && mode === "move" && selection().length > 0;
  $("readout").classList.toggle("show", show);
  if (!show) { if (roEditing) closeCoordEdit(false); return; }
  if (roEditing && roEditing.key !== selection().join(",")) closeCoordEdit(false);
  // One vertex: its position. Several: their centroid (shown with a "c" prefix).
  const multi = selection().length > 1;
  const p = selCentroid(), act = gesture && gesture.kind === "axis" ? gesture.axis : -1;
  ["roX", "roY", "roZ"].forEach((id, a) => {
    const el = $(id);
    el.textContent = (multi ? "c" : "") + "XYZ"[a] + " " + (Math.abs(p[a]) < 5e-5 ? 0 : p[a]).toFixed(3);
    el.classList.toggle("act", a === act);
    el.classList.toggle("locked", selAxisLocked(a));
    el.style.display = roEditing ? "none" : "";
  });
}


//----- Typed Coordinates -----||
// Tap X, Y or Z in the chip to type an exact value. Enter (or tapping ✓, or tapping
// elsewhere) applies it, Escape cancels. "±" flips the sign, because phone decimal
// keypads often have no minus key. Typed values are NOT snapped. Mirror rules still
// apply: the twin moves mirrored, and an on-plane vertex's mirror axis is locked at 0.
// The chip sits over the canvas but isn't the canvas, so tapping it never picks,
// orbits, or deselects. With several vertices selected the chip shows their centroid;
// typing a value moves the centroid there, i.e. moves every selected vertex by the
// same delta (on-plane verts stay locked on the mirror axis).
let roEditing = null;   // { key (the selection), axis } while the input is open

// With mirror on, a vertex on the plane can't leave it along the mirror axis.
function axisLocked(v, a) {
  return axisIndex(mesh.mirror) === a && mesh.partner[v] === v;
}

function openCoordEdit(a) {
  if (!selection().length) return;
  if (selAxisLocked(a)) { toast(`${"XYZ"[a]} is locked to the mirror plane (0)`); return; }
  roEditing = { key: selection().join(","), axis: a };
  const v = selCentroid()[a];
  $("roEditLbl").textContent = (selection().length > 1 ? "c" : "") + "XYZ"[a];
  $("roEditLbl").className = "xyz"[a];
  $("roInput").value = String(+(Math.abs(v) < 5e-5 ? 0 : v).toFixed(4));
  $("roEdit").classList.add("show");
  updateReadout();
  $("roInput").focus();
  $("roInput").select();
}

// Read the input: allows "-0.25", ".5", "0,5" (comma decimal), "+1".
function parseCoord(text) {
  const t = String(text).trim().replace(",", ".");
  if (!/^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/.test(t)) return null;
  const n = Number(t);
  return isFinite(n) ? n : null;
}

function closeCoordEdit(apply) {
  if (!roEditing) return;
  const { key, axis } = roEditing;
  roEditing = null;                                // first, so blur can't run this twice
  $("roEdit").classList.remove("show");
  if (document.activeElement === $("roInput")) $("roInput").blur();
  if (apply && key === selection().join(",") && selection().length) {
    const n = parseCoord($("roInput").value);
    if (n === null) toast("Not a number");
    else {
      const c = selCentroid()[axis];
      if (Math.abs(c - n) > 1e-9 && !selAxisLocked(axis)) {
        pushUndo();
        moveSelection(selStarts(), axis, n - c);   // twins follow mirrored
        meshChanged();
      }
    }
  }
  updateUI();
}

for (const id of ["roX", "roY", "roZ"])
  $(id).addEventListener("click", (e) => { e.stopPropagation(); openCoordEdit(+$(id).dataset.axis); });
$("roInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); closeCoordEdit(true); }
  else if (e.key === "Escape") { e.preventDefault(); closeCoordEdit(false); }
});
$("roInput").addEventListener("blur", () => closeCoordEdit(true));
// The buttons keep focus in the input (preventDefault on pointerdown), so pressing them
// doesn't blur-and-apply early.
for (const id of ["roNeg", "roOk"]) $(id).addEventListener("pointerdown", (e) => e.preventDefault());
$("roNeg").addEventListener("click", () => {
  const el = $("roInput"), t = el.value.trim();
  el.value = t.startsWith("-") ? t.slice(1) : t.startsWith("+") ? "-" + t.slice(1) : "-" + t;
  el.focus();
});
$("roOk").addEventListener("click", () => closeCoordEdit(true));

for (const b of document.querySelectorAll("[data-mode]"))
  b.addEventListener("click", () => { mode = b.dataset.mode; overlayOn = true; meshDirty = true; updateUI(); });

$("bSnap").addEventListener("click", () => {
  snapOn = !snapOn;
  // Turning snap on also snaps the selected vertex, so it lands on the grid straight away.
  if (snapOn && selection().length) {
    const drivers = selDrivers();
    if (drivers.some(i => v3.len(v3.sub(snap(getVert(i)), getVert(i))) > 1e-9)) {
      pushUndo();
      for (const i of drivers) moveVertex(i, snap(getVert(i)));
    }
  }
  meshChanged();
});

$("bBake").addEventListener("click", () => { bakeOn = !bakeOn; meshChanged(); });

//----- Mirror + Symm Buttons -----||
// Mirror cycles X -> Y -> off -> X and re-pairs twins from positions. The toast always
// says what it found, so a model that isn't symmetric is obvious straight away:
//   "Mirror X: 4 pairs, 2 on the plane"  or  "Mirror X: no symmetric pairs: tap Symm ..."
function mirrorSummary() {
  const ax = axisIndex(mesh.mirror);
  if (ax < 0) return "Mirror off";
  let pairs = 0, onPlane = 0, lone = 0;
  mesh.partner.forEach((q, i) => { if (q === i) onPlane++; else if (q > i) pairs++; else if (q < 0) lone++; });
  const name = "Mirror " + mesh.mirror.toUpperCase();
  if (!pairs && !onPlane) return `${name}: no symmetric pairs. Tap Symm to mirror one side onto the other.`;
  let msg = `${name}: ${pairs} pair${pairs === 1 ? "" : "s"}` + (onPlane ? `, ${onPlane} on the plane` : "");
  if (lone) msg += `, ${lone} without a twin (red): Symm fixes it`;
  const nt = foldedTriCount();
  if (nt) msg += `, ${nt} folded tri${nt === 1 ? "" : "s"}`;
  return msg;
}

$("bMirror").addEventListener("click", () => {
  pushUndo();
  mesh.mirror = mesh.mirror === "x" ? "y" : mesh.mirror === "y" ? null : "x";
  const nv = pairMirror(mesh), nt = foldedTriCount();
  lastWarn = { nv, nt };                           // this toast already reports them
  toast(mirrorSummary());
  meshChanged();
});

// Mirror the whole mesh across the plane (positions flip, winding reverses so faces
// still point outwards). Used to run Symm "from the − side": flip, symmetrize, flip back.
function flipMesh(ax) {
  for (let i = 0; i < vertCount(); i++) mesh.positions[i*3 + ax] = -mesh.positions[i*3 + ax];
  for (let t = 0; t < triCount(); t++) {
    const b = mesh.tris[t*3 + 1];
    mesh.tris[t*3 + 1] = mesh.tris[t*3 + 2]; mesh.tris[t*3 + 2] = b;
  }
}

// Symm makes the model exactly symmetric by copying one side onto the other.
//  - Already symmetric (every vert paired, nothing folded): says so, changes nothing
//    (no pointless centre cuts).
//  - Which side is kept: the side your selection is on; with nothing selected (or the
//    selection on the plane), the side with more vertices (+ wins a tie).
function doSymm() {
  const ax = axisIndex(mesh.mirror);
  if (ax < 0) { toast("Turn Mirror on first"); return; }
  pairMirror(mesh);
  const name = mesh.mirror.toUpperCase();
  if (!unpairedCount() && !foldedTriCount()) { toast(`Already symmetric across ${name}: nothing to change`); meshChanged(); return; }
  let sign = 0;
  const c = selCentroid();
  if (c && Math.abs(c[ax]) > PLANE_TOL) sign = Math.sign(c[ax]);
  if (!sign) {
    let plus = 0, minus = 0;
    for (let i = 0; i < vertCount(); i++) { const v = mesh.positions[i*3 + ax]; if (v > PLANE_TOL) plus++; else if (v < -PLANE_TOL) minus++; }
    sign = minus > plus ? -1 : 1;
  }
  const before = snapshot();
  if (sign < 0) flipMesh(ax);
  const ok = symmetrize();
  if (sign < 0) flipMesh(ax);
  if (!ok) { mesh = JSON.parse(before); toast(`Nothing on the ${sign < 0 ? "−" : "+"}${name} side to copy`); return; }
  pairMirror(mesh);
  pushUndo(before); clearSelection(); meshChanged();
  const from = (sign < 0 ? "−" : "+") + name, to = (sign < 0 ? "+" : "−") + name;
  toast(`Symm: copied the ${from} side onto ${to} (${vertCount()} verts, ${triCount()} tris)`);
}
$("bSym").addEventListener("click", doSymm);

$("bUndo").addEventListener("click", undo);
$("bDissolve").addEventListener("click", () => {
  if (selection().length !== 1) return;
  const before = snapshot();
  const r = dissolveVertex(selected);
  if (r === true) { pushUndo(before); clearSelection(); meshChanged(); toast("Vertex dissolved"); }
  else toast("Can't dissolve: " + r);
});
$("bRock").addEventListener("click", () => {
  showRock = !showRock;
  try { localStorage.setItem(ROCK_KEY, showRock ? "1" : "0"); } catch (e) { /* ignore */ }

  toast(showRock ? `Game rock (shape 0): ${f(0)} × ${f(1)} × ${f(2)} units, display only` : "Rock hidden");

});
$("bImport").addEventListener("click", openImport);
$("iClose").addEventListener("click", () => $("importModal").classList.remove("show"));
$("iGo").addEventListener("click", () => {

});
$("bExport").addEventListener("click", doExport);
$("bNew").addEventListener("click", () => {

});

$("exportName").addEventListener("input", () => {
  modelName = cIdent($("exportName").value);
  $("exportText").value = buildExport();
  save();
});
$("mClose").addEventListener("click", () => $("modal").classList.remove("show"));
$("mCopy").addEventListener("click", async () => {
  const ok = await copyText(buildExport());

});


//----- Palettes: Data -----||
// Palettes live in localStorage under their own key, separate from the model, so they
// survive New / Import and are shared by every model. The built-in palette ("default")
// is not stored: it's always there as a fallback, read-only, and can't be deleted.
//   { v: 1, active: "<id>", list: [ { id, name, colors: [[r,g,b] 0..1, ...] }, ... ] }
const PAL_KEY = "pofa-modeler-palettes";
const BUILTIN = { id: "default", name: "PICO-8 (built-in)", colors: DEFAULT_PALETTE, builtin: true };
let palStore = { v: 1, active: "default", list: [] };
let palEditMode = false;

function palLoad() {
  try {
    const d = JSON.parse(localStorage.getItem(PAL_KEY));
    if (d && d.v === 1 && Array.isArray(d.list)) {
      palStore.list = d.list.filter(p => p && typeof p.id === "string" && typeof p.name === "string" && Array.isArray(p.colors))
        .map(p => ({ id: p.id, name: p.name, colors: p.colors.filter(c => Array.isArray(c) && c.length === 3 && c.every(isFinite)) }));
      palStore.active = typeof d.active === "string" ? d.active : "default";
    }
  } catch (e) { /* corrupt: start with just the built-in */ }
}
function palSave() {
  try { localStorage.setItem(PAL_KEY, JSON.stringify(palStore)); } catch (e) { /* ignore */ }
}
const allPalettes = () => [BUILTIN, ...palStore.list];
const activePalette = () => palStore.list.find(p => p.id === palStore.active) || BUILTIN;
const newPalId = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function uniqueName(base) {
  let name = base, n = 2;
  while (allPalettes().some(p => p.name === name)) name = base + " " + n++;
  return name;
}
function createPalette(name, colors) {
  const p = { id: newPalId(), name: uniqueName(name), colors: colors.map(c => c.map(round3)) };
  palStore.list.push(p);
  palStore.active = p.id;
  palSave();
  return p;
}

// After a model import: colours not in the active palette go into "Imported" (made if
// needed). The active palette doesn't change. Returns how many colours were added.
// Colours closer than IMPORT_EPS (about 2/3 of one 8-bit step) count as the same, so tiny
// rounding differences from un-baking light don't add near-duplicate swatches.
const IMPORT_EPS = 0.0026;
function addToImportedPalette(colors) {
  const act = activePalette(), fresh = [];
  for (const c of colors) {
    const r = c.map(v => round3(Math.min(1, Math.max(0, v))));
    if (act.colors.some(k => colorEq(k, r, IMPORT_EPS)) || fresh.some(k => colorEq(k, r, IMPORT_EPS))) continue;
    fresh.push(r);
  }
  if (!fresh.length) return 0;
  let imp = palStore.list.find(p => p.name === "Imported");
  if (!imp) { imp = { id: newPalId(), name: "Imported", colors: [] }; palStore.list.push(imp); }
  let added = 0;
  for (const r of fresh) if (!imp.colors.some(k => colorEq(k, r, IMPORT_EPS))) { imp.colors.push(r); added++; }
  palSave();
  return added;
}

// Hex <-> 0..1 floats.
const toHex = (c) => "#" + c.map(v => Math.round(Math.min(1, Math.max(0, v)) * 255).toString(16).padStart(2, "0")).join("");
function fromHex(h) {
  let t = String(h).trim().replace(/^#/, "");
  if (/^[0-9a-fA-F]{3}$/.test(t)) t = t.split("").map(ch => ch + ch).join("");
  if (!/^[0-9a-fA-F]{6}$/.test(t)) return null;
  return [0, 2, 4].map(i => round3(parseInt(t.slice(i, i + 2), 16) / 255));
}


//----- Palettes: C++ Export / Import -----||
// Export matches the vertex export's style and precision (3 decimals + f):
//   static const float <name>_palette[][3] = { {r, g, b}, ... };
//   static const int <name>_palette_count = N;
function buildPaletteExport(p) {
  const name = cIdent(p.name);
  const L = [];
  L.push(`// ${name}: ${p.colors.length} colors (exported from Vert Modeler), r, g, b in 0..1`);
  L.push(`static const float ${name}_palette[][3] = {`);
  for (const c of p.colors) L.push(`    {${c.map(f3).join(", ")}},   // ${toHex(c)}`);
  L.push(`};`);
  L.push(`static const int ${name}_palette_count = ${p.colors.length};`);
  return L.join("\n") + "\n";
}

// Accepts: that C++ snippet (name from "<name>_palette"), or a list of hex codes
// (#rrggbb / rrggbb / #rgb, separated by commas, spaces, or new lines), or bare float
// triples in 0..1. Throws an Error with a readable message for anything else.
function parsePalette(text) {
  const src = String(text);
  const noComments = (t) => t.replace(/\/\*[\s\S]*?\*\//g, " ").replace(/\/\/[^\n]*/g, " ");
  const nameMatch = src.match(/([A-Za-z_][A-Za-z0-9_]*)_palette\s*\[/);
  let body = noComments(src), name = nameMatch ? nameMatch[1] : null;
  if (nameMatch) {
    // The array's outer braces: first "{" after the name, to its matching "}".
    const clean = noComments(src.slice(nameMatch.index));
    const open = clean.indexOf("{");
    if (open < 0) throw new Error("found " + name + "_palette but no { ... } after it");
    let depth = 0, close = -1;
    for (let i = open; i < clean.length; i++) {
      if (clean[i] === "{") depth++;
      else if (clean[i] === "}" && --depth === 0) { close = i; break; }
    }
    if (close < 0) throw new Error("the palette's braces aren't closed");
    body = clean.slice(open + 1, close);
  }
  const tokens = body.split(/[\s,;]+/).filter(Boolean);
  if (!tokens.length) throw new Error("nothing to import");
  let colors;
  if (!nameMatch && tokens.every(t => /^#?([0-9a-fA-F]{6}|[0-9a-fA-F]{3})$/.test(t) && (/^#/.test(t) || /[a-fA-F]/.test(t) || t.length === 6))) {
    colors = tokens.map(fromHex);
  } else {
    const stripped = body.replace(/[{}]/g, " ");
    if (/#[0-9a-fA-F]/.test(stripped)) throw new Error("mixes hex codes with other text");
    const bad = stripped.split(/[\s,;]+/).filter(Boolean).find(t => !/^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?[fF]?$/.test(t));
    if (bad) throw new Error(`"${bad.slice(0, 20)}" isn't a number or hex colour`);
    const nums = (stripped.match(/[-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?/g) || []).map(Number);
    if (nums.length % 3) throw new Error(nums.length + " numbers isn't a whole number of r, g, b colours");
    if (nums.some(n => !(n >= 0 && n <= 1))) throw new Error("colour values must be between 0 and 1");
    colors = [];
    for (let i = 0; i < nums.length; i += 3) colors.push([nums[i], nums[i+1], nums[i+2]].map(round3));
  }
  if (!colors.length) throw new Error("no colours found");
  if (colors.length > 256) throw new Error("more than 256 colours");
  return { name, colors };
}


//----- Palettes: UI -----||
// Where it lives: Paint mode shows the palette bar above the toolbar.
//   [palette icon] <name> ▾ : opens the Palettes manager (switch, New, Duplicate, Rename, Delete,
//                 Export C++ with Copy, Import).
//   ✎ Edit      : edit mode: tap a swatch to change/delete it, "+" adds one.
//                 Long-press a swatch does the same without edit mode.
// The built-in palette is read-only (Edit tells you to Duplicate it).
let palRenderKey = "";
function renderPalette() {
  const p = activePalette();
  // updateUI runs on every drag step: only rebuild the swatch buttons when something changed.
  const key = JSON.stringify([p.id, p.name, p.colors, currentColor, palEditMode]);
  if (key === palRenderKey) return;
  palRenderKey = key;
  $("palNameText").textContent = p.name;
  $("palEdit").classList.toggle("on", palEditMode);
  $("palette").classList.toggle("editing", palEditMode);
  const box = $("swatches");
  box.textContent = "";
  p.colors.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "swatch" + (colorEq(c, currentColor, 0.0006) ? " on" : "");
    b.dataset.i = i;
    b.style.background = toHex(c);
    b.title = toHex(c);
    attachSwatchPress(b, i);
    box.appendChild(b);
  });
  if (palEditMode && !p.builtin) {
    const add = document.createElement("button");
    add.className = "swatch add"; add.textContent = "+";
    add.addEventListener("click", () => openSwatchEditor(-1));
    box.appendChild(add);
  }
}

// Tap = pick the colour (or edit, in edit mode). Long-press (450 ms) = edit.
function attachSwatchPress(b, i) {
  let timer = 0, longFired = false;
  b.addEventListener("pointerdown", () => {
    longFired = false;
    timer = setTimeout(() => { longFired = true; openSwatchEditor(i); }, 450);
  });
  const cancel = () => clearTimeout(timer);
  b.addEventListener("pointerup", cancel);
  b.addEventListener("pointerleave", cancel);
  b.addEventListener("pointercancel", cancel);
  b.addEventListener("contextmenu", (e) => e.preventDefault());
  b.addEventListener("click", () => {
    if (longFired) return;
    if (palEditMode) { openSwatchEditor(i); return; }
    currentColor = activePalette().colors[i].slice();
    save(); updateUI();
  });
}

let swEditing = -1;   // swatch index being edited, -1 = adding a new one
function openSwatchEditor(i) {
  const p = activePalette();
  if (p.builtin) { toast("The built-in palette is read-only: Duplicate it (palette name ▾) to edit"); return; }
  swEditing = i;
  const c = i >= 0 ? p.colors[i] : currentColor;
  $("swTitle").textContent = i >= 0 ? "Edit colour " + (i + 1) : "Add colour";
  $("swColor").value = toHex(c);
  $("swHex").value = toHex(c);
  $("swDelete").style.display = i >= 0 ? "" : "none";
  $("swModal").classList.add("show");
}
$("swColor").addEventListener("input", () => { $("swHex").value = $("swColor").value; });
$("swHex").addEventListener("input", () => { const c = fromHex($("swHex").value); if (c) $("swColor").value = toHex(c); });
$("swCancel").addEventListener("click", () => $("swModal").classList.remove("show"));
$("swSave").addEventListener("click", () => {
  const c = fromHex($("swHex").value);
  if (!c) { toast("Use a hex colour like #ff004d"); return; }
  const p = activePalette();
  if (swEditing >= 0) p.colors[swEditing] = c; else p.colors.push(c);
  currentColor = c.slice();
  palSave(); save();
  $("swModal").classList.remove("show");
  updateUI();
});
$("swDelete").addEventListener("click", () => {
  const p = activePalette();
  if (swEditing >= 0) p.colors.splice(swEditing, 1);
  palSave();
  $("swModal").classList.remove("show");
  updateUI();
});

$("palEdit").addEventListener("click", () => {
  if (activePalette().builtin) { toast("The built-in palette is read-only: Duplicate it (palette name ▾) to edit"); palEditMode = false; }
  else palEditMode = !palEditMode;
  updateUI();
});

// --- Manager modal
function renderPalList() {
  const list = $("palList");
  list.textContent = "";
  for (const p of allPalettes()) {
    const b = document.createElement("button");
    b.className = "palItem" + (p.id === activePalette().id ? " on" : "");
    const label = document.createElement("span");
    label.textContent = `${p.name} · ${p.colors.length}`;
    const strip = document.createElement("span");
    strip.className = "strip";
    for (const c of p.colors.slice(0, 32)) { const i = document.createElement("i"); i.style.background = toHex(c); strip.appendChild(i); }
    b.append(label, strip);
    b.addEventListener("click", () => { palStore.active = p.id; palEditMode = false; palSave(); renderPalList(); updateUI(); });
    list.appendChild(b);
  }
  $("pmRename").disabled = $("pmDelete").disabled = !!activePalette().builtin;
}
function showPalIO(kind) {
  $("palIO").classList.add("show");
  $("palIOTitle").textContent = kind === "export" ? activePalette().name + " (C++)" : "Paste C++, hex codes, or r g b floats";
  $("pioCopy").style.display = kind === "export" ? "" : "none";
  $("pioGo").style.display = kind === "import" ? "" : "none";
  $("palText").readOnly = kind === "export";
  $("palText").value = kind === "export" ? buildPaletteExport(activePalette()) : "";
  if (kind === "import") setTimeout(() => $("palText").focus(), 50);
}
function importPaletteText(text) {
  let r;
  try { r = parsePalette(text); } catch (e) { toast("Palette import failed: " + e.message); return null; }
  const p = createPalette(r.name || "Imported palette", r.colors);
  toast(`Imported palette "${p.name}" (${p.colors.length} colours)`);
  return p;
}
$("palName").addEventListener("click", () => { $("palIO").classList.remove("show"); renderPalList(); $("palModal").classList.add("show"); });
$("pmClose").addEventListener("click", () => $("palModal").classList.remove("show"));
$("pmNew").addEventListener("click", () => {
  const n = prompt("Name for the new palette:", uniqueName("My palette"));
  if (n === null) return;
  createPalette(n.trim() || "My palette", [currentColor.slice()]);
  palEditMode = true; renderPalList(); updateUI();
});
$("pmDup").addEventListener("click", () => {
  const a = activePalette();
  createPalette(a.builtin ? "My palette" : a.name + " copy", a.colors);
  renderPalList(); updateUI();
});
$("pmRename").addEventListener("click", () => {
  const a = activePalette();
  if (a.builtin) return;
  const n = prompt("Rename palette:", a.name);
  if (n === null || !n.trim() || n.trim() === a.name) return;
  a.name = uniqueName(n.trim()); palSave(); renderPalList(); updateUI();
});
$("pmDelete").addEventListener("click", () => {
  const a = activePalette();
  if (a.builtin) return;
  if (!confirm(`Delete palette "${a.name}"? (Models keep their colours.)`)) return;
  palStore.list = palStore.list.filter(p => p.id !== a.id);
  palStore.active = "default"; palEditMode = false;
  palSave(); renderPalList(); updateUI();
});
$("pmExport").addEventListener("click", async () => {
  showPalIO("export");
  const ok = await copyText($("palText").value);
  toast(ok ? "Palette copied to clipboard" : "Tap Copy, or select the text");
});
$("pmImport").addEventListener("click", () => showPalIO("import"));
$("pioCopy").addEventListener("click", async () => {
  const ok = await copyText($("palText").value);
  toast(ok ? "Copied to clipboard" : "Copy failed: long-press the text to copy");
});
$("pioGo").addEventListener("click", () => {
  if (importPaletteText($("palText").value)) { $("palIO").classList.remove("show"); renderPalList(); updateUI(); }
});


//----- Resize (handles devicePixelRatio) -----||
// The canvas has a CSS size (layout) and a pixel size (drawing buffer). On a phone
// with DPR 3, a 390 px wide canvas needs 1170 real pixels to look sharp.
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const r = canvas.getBoundingClientRect();
  viewW = Math.max(1, r.width); viewH = Math.max(1, r.height);
  const w = Math.round(viewW * dpr), h = Math.round(viewH * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}
window.addEventListener("resize", resize);
new ResizeObserver(resize).observe(canvas);


//----- Draw Loop -----||
function frame() {
  resize();
  updateCamera();
  // The dots' grey/white look depends on the camera too, so rebuild when the view moved.
  if (!meshDirty && visCache.key.split("|")[0] !== [cam.yaw, cam.pitch, cam.dist, ...cam.target, viewW, viewH].join(",")) meshDirty = true;
  if (meshDirty) rebuildBuffers();

  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.086, 0.09, 0.114, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.useProgram(prog);
  gl.uniformMatrix4fv(U.mvp, false, viewProj);
  gl.uniform1f(U.alpha, 1);
  gl.uniform1i(U.round, 0);

  // 1) Ground grid
  gl.bindVertexArray(gridBatch.vao);
  gl.drawArrays(gl.LINES, 0, gridBatch.count);

  // 2) Faces, pushed slightly back in depth so the edge lines on top don't flicker.
  //    No back-face culling: faces stay visible even if a drag turns one inside-out.
  gl.enable(gl.POLYGON_OFFSET_FILL);
  gl.polygonOffset(1, 1);
  gl.bindVertexArray(faceBatch.vao);
  gl.drawArrays(gl.TRIANGLES, 0, faceBatch.count);
  // 2b) Reference rock (display only): the game's colours, no edges, just like in game.
  if (showRock) {
    gl.bindVertexArray(rockBatch.vao);
    gl.drawArrays(gl.TRIANGLES, 0, rockBatch.count);
  }
  gl.disable(gl.POLYGON_OFFSET_FILL);

  // Clean preview: stop here, so only the model (+ grid and rock) shows.
  if (!overlayOn) { gl.bindVertexArray(null); requestAnimationFrame(frame); return; }

  // 3) Edges (depth tested, so hidden edges stay hidden)
  gl.bindVertexArray(edgeBatch.vao);
  gl.drawArrays(gl.LINES, 0, edgeBatch.count);

  // 4) Mirror plane: translucent, blended over what's behind, and it doesn't write
  //    depth so it never hides anything.
  if (planeBatch.count) {
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    gl.uniform1f(U.alpha, 0.16);
    gl.bindVertexArray(planeBatch.vao);
    gl.drawArrays(gl.TRIANGLES, 0, planeBatch.count);
    gl.uniform1f(U.alpha, 1);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }

  // 5) Vertex dots, drawn on top of everything so back vertices can still be grabbed.
  gl.disable(gl.DEPTH_TEST);
  gl.uniform1i(U.round, 1);
  gl.uniform1f(U.size, 10 * dpr);
  gl.bindVertexArray(dotBatch.vao);
  gl.drawArrays(gl.POINTS, 0, dotBatch.count);

  // 6) Move gizmo on the selected vertex (on top of everything, like the dots).
  drawGizmo();

  gl.bindVertexArray(null);
  requestAnimationFrame(frame);
}


//----- Gizmo Drawing -----||
// Rebuilt every frame (it's tiny): it must keep the same on-screen size as you zoom.
// Shafts are thick quads (WebGL lines are only 1 px wide), turned to face the camera;
// tips are big round points. The handle being dragged turns yellow and shows a thin guide
// line through the vertex's start position along its axis.
function drawGizmo() {
  const hs = gizmoHandles();
  if (!hs.length) return;
  const p = selCentroid();
  const viewDir = v3.norm(v3.sub(p, camEye()));
  const halfW = 3 * worldPerPx(hs[0].s0.depth);    // shaft half-width: 3 CSS px
  const act = gesture && gesture.kind === "axis" ? gesture.axis : -1;
  const quads = [], tips = [], guide = [];
  for (const h of hs) {
    if (!h.visible) continue;
    let col = AXIS_COLORS[h.axis];
    if (h.locked) col = [0.4, 0.4, 0.45];
    if (h.axis === act) col = [1.0, 0.85, 0.1];
    const dir = [0, 0, 0]; dir[h.axis] = 1;
    const side = v3.scale(v3.norm(v3.cross(dir, viewDir)), halfW);
    const a0 = v3.add(p, v3.scale(v3.sub(h.tipW, p), 0.12)), a1 = h.tipW;   // leave a gap at the vertex
    const c = [v3.add(a0, side), v3.sub(a0, side), v3.sub(a1, side), v3.add(a1, side)];
    for (const k of [0, 1, 2, 0, 2, 3]) quads.push(...c[k], ...col);
    tips.push(...h.tipW, ...col);
  }
  if (act >= 0) {
    const g = gesture.p0, far = 50;
    const a = g.slice(), b = g.slice(); a[act] -= far; b[act] += far;
    guide.push(...a, 1.0, 0.85, 0.1, ...b, 1.0, 0.85, 0.1);
  }
  uploadBatch(gizmoBatch, quads);
  uploadBatch(gizmoTips, tips);
  uploadBatch(gizmoGuide, guide);

  gl.disable(gl.DEPTH_TEST);
  gl.uniform1i(U.round, 0);
  if (guide.length) {
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.uniform1f(U.alpha, 0.55);
    gl.bindVertexArray(gizmoGuide.vao);
    gl.drawArrays(gl.LINES, 0, gizmoGuide.count);
    gl.uniform1f(U.alpha, 1);
    gl.disable(gl.BLEND);
  }
  gl.bindVertexArray(gizmoBatch.vao);
  gl.drawArrays(gl.TRIANGLES, 0, gizmoBatch.count);
  gl.uniform1i(U.round, 1);
  gl.uniform1f(U.size, 24 * dpr);                  // 24 CSS px balls (grab radius is 30 px)
  gl.bindVertexArray(gizmoTips.vao);
  gl.drawArrays(gl.POINTS, 0, gizmoTips.count);
}


//----- Start -----||
newModel("x");   // default: mirror X on
palLoad();
load();
updateUI();
requestAnimationFrame(frame);
</script>
</body>
</html>
