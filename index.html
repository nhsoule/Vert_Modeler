<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- user-scalable=no + touch-action:none (below) stop the browser zooming/scrolling,
     so every finger gesture comes to us. viewport-fit=cover uses the whole screen on
     notched phones; we pad with safe-area insets instead. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vert Modeler">
<meta name="application-name" content="Vert Modeler">
<meta name="theme-color" content="#16171d">
<meta name="pofa-modeler-version" content="v10-multi-select">
<title>Vert Modeler</title>
<style>
  /* ----- Page Setup -----|| */
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #16171d; color: #e8e8ee;
    font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* The 3D view takes all the space the bars don't. */
  #view { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* ----- Info Overlay -----|| */
  /* No persistent text on top of the view any more: this box only shows the one fatal
     message ("WebGL 2 is not available") and is empty (and hidden) otherwise. */
  #info {
    position: absolute; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top) + 8px) 12px 8px;
    pointer-events: none; font-size: 13px; color: #b9bccb;
    text-shadow: 0 1px 2px #000;
  }
  #info:empty { display: none; }

  /* ----- Stats Line -----|| */
  /* One small, dim line in the top-left corner: what the game will upload. */
  #stats {
    position: absolute; left: 10px; top: calc(env(safe-area-inset-top) + 6px);
    pointer-events: none; font: 11px ui-monospace, Menlo, Consolas, monospace;
    color: #8a8ea0; text-shadow: 0 1px 2px #000; white-space: nowrap;
  }
  #stats.hide { display: none; }

  /* Monochrome inline icons (SVG with currentColor), so nothing renders as colour emoji. */
  .svgic { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; fill: currentColor; }

  /* ----- Palette Bar (Paint mode) -----|| */
  #palette { display: none; padding: 6px 10px 8px; background: #1f2029; border-top: 1px solid #2c2e3a; }
  #palette.show { display: block; }
  .palHead { display: flex; gap: 6px; margin-bottom: 6px; }
  .palHead button {
    min-height: 38px; border: 0; border-radius: 9px; background: #2a2c38; color: #e8e8ee;
    font: inherit; font-size: 13px; padding: 0 12px; touch-action: manipulation;
  }
  .palHead #palName { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .palHead button.on { background: #e0b43a; color: #16171d; }
  #swatches {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
    max-height: 82px; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .swatch { height: 36px; border-radius: 8px; border: 2px solid #0000; padding: 0; touch-action: manipulation; }
  .swatch.on { border-color: #fff; box-shadow: 0 0 0 2px #000 inset; }
  .swatch.add { background: #2a2c38; color: #e8e8ee; font-size: 22px; line-height: 1; }
  #palette.editing .swatch:not(.add) { border-style: dashed; border-color: #e0b43a; }

  /* ----- Toolbar (two rows: tools on top, toggles/actions below) -----|| */
  #toolbar {
    display: flex; flex-direction: column; gap: 4px;
    padding: 6px 6px calc(env(safe-area-inset-bottom) + 6px);
    background: #1f2029; border-top: 1px solid #2c2e3a;
  }
  .row { display: flex; gap: 4px; }
  #toolbar button {
    flex: 1; min-width: 0; min-height: 52px;
    background: #2a2c38; color: #e8e8ee; border: 0; border-radius: 10px;
    font: inherit; font-size: 12px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px; touch-action: manipulation;
  }
  #toolbar .row.small button { min-height: 46px; font-size: 11px; }
  #toolbar button .ic { font-size: 19px; line-height: 1; }
  #toolbar button.on { background: #e0b43a; color: #16171d; }
  #toolbar button:disabled { opacity: 0.35; }
  #toolbar button:active { filter: brightness(1.3); }

  /* ----- Export / Import Modals -----|| */
  .modal {
    display: none; position: fixed; inset: 0; background: #000d;
    padding: calc(env(safe-area-inset-top) + 16px) 12px calc(env(safe-area-inset-bottom) + 16px);
    box-sizing: border-box; flex-direction: column; gap: 8px; z-index: 10;
  }
  .modal.show { display: flex; }
  .modal .head { display: flex; align-items: center; gap: 8px; }
  .modal .head span { flex: 1; font-weight: 600; }
  .modal .note { font-size: 12px; color: #9a9db0; }
  .modal label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #b9bccb; }
  #exportName {
    flex: 1; min-height: 40px; box-sizing: border-box; padding: 0 10px;
    background: #0d0e12; color: #fff; border: 1px solid #2c2e3a; border-radius: 8px;
    font: 15px ui-monospace, Menlo, Consolas, monospace; -webkit-user-select: text; user-select: text;
  }
  .modal button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: #e0b43a; color: #16171d; font: inherit; font-weight: 600; }
  .modal button.alt { background: #2a2c38; color: #e8e8ee; }
  #exportText, #importText {
    flex: 1; width: 100%; box-sizing: border-box; resize: none;
    background: #0d0e12; color: #cfe3c0; border: 1px solid #2c2e3a; border-radius: 8px;
    font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; padding: 8px;
    -webkit-user-select: text; user-select: text; white-space: pre; overflow: auto;
  }

  #importText { color: #e8e8ee; }

  /* ----- Palette Manager + Swatch Editor -----|| */
  .btnrow { display: flex; gap: 6px; }
  .btnrow button { flex: 1; }
  #palList { display: flex; flex-direction: column; gap: 6px; max-height: 32vh; overflow-y: auto; }
  .palItem {
    display: flex; flex-direction: column; align-items: stretch; gap: 4px; text-align: left;
    min-height: 48px; padding: 6px 10px !important; background: #2a2c38 !important; color: #e8e8ee !important;
    border: 2px solid #0000 !important; font-weight: 500 !important;
  }
  .palItem.on { border-color: #e0b43a !important; }
  .palItem .strip { display: flex; height: 10px; border-radius: 3px; overflow: hidden; }
  .palItem .strip i { flex: 1; }
  #palText {
    flex: 1; min-height: 120px; width: 100%; box-sizing: border-box; resize: none;
    background: #0d0e12; color: #cfe3c0; border: 1px solid #2c2e3a; border-radius: 8px;
    font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; padding: 8px;
    -webkit-user-select: text; user-select: text; white-space: pre; overflow: auto;
  }
  #palIO { display: none; flex-direction: column; gap: 6px; flex: 1; min-height: 0; }
  #palIO.show { display: flex; }
  #swModal { justify-content: center; }
  #swModal .card { background: #1f2029; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  #swColor { width: 100%; height: 64px; border: 0; border-radius: 10px; padding: 0; background: none; }
  #swHex {
    min-height: 44px; box-sizing: border-box; padding: 0 10px; background: #0d0e12; color: #fff;
    border: 1px solid #2c2e3a; border-radius: 8px; font: 17px ui-monospace, Menlo, Consolas, monospace;
    -webkit-user-select: text; user-select: text;
  }

  /* ----- Gizmo Coordinate Readout -----|| */
  #readout {
    position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
    display: none; gap: 10px; padding: 6px 12px; border-radius: 16px;
    background: #000b; white-space: nowrap; align-items: center;
    font: 14px ui-monospace, Menlo, Consolas, monospace;
  }
  #readout.show { display: flex; }
  /* Each number is a finger-sized button: tap it to type an exact value. */
  #readout .ro {
    opacity: 0.85; padding: 8px 6px; min-height: 24px; border-radius: 8px;
    touch-action: manipulation; cursor: pointer;
  }
  #readout .ro.act { opacity: 1; font-weight: 700; text-decoration: underline; }
  #readout .ro.locked { opacity: 0.4; }
  #readout .ro:active { background: #fff2; }
  #roEdit { display: none; align-items: center; gap: 6px; }
  #roEdit.show { display: flex; }
  #roEdit input {
    width: 7.5em; min-height: 40px; box-sizing: border-box; padding: 0 8px;
    background: #0d0e12; color: #fff; border: 1px solid #e0b43a; border-radius: 8px;
    font: 17px ui-monospace, Menlo, Consolas, monospace;   /* >= 16px: iOS won't zoom in */
    -webkit-user-select: text; user-select: text;
  }
  #roEdit button {
    min-width: 40px; min-height: 40px; border: 0; border-radius: 8px;
    background: #2a2c38; color: #e8e8ee; font: 17px system-ui, sans-serif; touch-action: manipulation;
  }
  #roEdit button.ok { background: #e0b43a; color: #16171d; }
  #readout .x { color: #ff7a7a; } #readout .y { color: #7ee08a; } #readout .z { color: #7fa6ff; }

  /* Small transient message ("Copied!") */
  #toast {
    position: fixed; left: 50%; bottom: 170px; transform: translateX(-50%);
    background: #000c; color: #fff; padding: 8px 14px; border-radius: 20px; text-align: center;
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20; max-width: 85vw;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="gl"></canvas>
    <div id="info"></div>
    <div id="stats"></div>
    <div id="readout">
      <span class="ro x" id="roX" data-axis="0"></span><span class="ro y" id="roY" data-axis="1"></span><span class="ro z" id="roZ" data-axis="2"></span>
      <span id="roEdit">
        <span id="roEditLbl"></span>
        <input id="roInput" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button id="roNeg" type="button" aria-label="Flip sign">±</button>
        <button id="roOk" type="button" class="ok" aria-label="Apply">✓︎</button>
      </span>
    </div>
  </div>
  <div id="palette">
    <div class="palHead">
      <button id="palName" aria-label="Palettes"><svg class="svgic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5C6.8 2.5 2.5 6.6 2.5 11.8c0 5 4.1 9.7 9 9.7 1.4 0 2.3-1 2.3-2.2 0-.6-.2-1.1-.6-1.5-.3-.4-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8h2.1c3 0 4.9-2.2 4.9-5C21.5 5.9 17.2 2.5 12 2.5zM6.8 12.6a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4.2a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm4.4 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3 4.2a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg> <span id="palNameText"></span> ▾</button>
      <button id="palEdit">✎︎ Edit</button>
    </div>
    <div id="swatches"></div>
  </div>
  <div id="toolbar">
    <div class="row">
      <button id="bMove"  data-mode="move"><span class="ic">✥</span>Move</button>
      <button id="bSplit" data-mode="split"><span class="ic">✂︎</span>Split</button>
      <button id="bPaint" data-mode="paint"><span class="ic"><svg class="svgic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 3.3a1 1 0 0 0-1.4 0L10 12.6l1.4 1.4 9.3-9.3a1 1 0 0 0 0-1.4zM8.6 13.4c-1.9 0-3.4 1.5-3.4 3.4 0 1.1-.9 2-2 2.2.8 1.1 2.2 1.8 3.7 1.8 2.6 0 4.6-2 4.6-4.6 0-.4-.1-.8-.2-1.2z"/></svg></span>Paint</button>
      <button id="bUndo"><span class="ic">↶︎</span>Undo</button>
      <button id="bDissolve"><span class="ic">⌫︎</span>Dissolve</button>
      <button id="bRock"><span class="ic">◆︎</span>Rock</button>
    </div>
    <div class="row small">
      <button id="bMirror"><span class="ic">⇋︎</span><span id="mirrorLabel">Mirror X</span></button>
      <button id="bSym"><span class="ic">⧓</span>Symm</button>
      <button id="bSnap"><span class="ic">#</span>Snap</button>
      <button id="bBake"><span class="ic">☀︎</span>Shade</button>
      <button id="bImport"><span class="ic">⇩</span>Import</button>
      <button id="bExport"><span class="ic">⇪</span>Export</button>
      <button id="bNew"><span class="ic">□︎</span>New</button>
    </div>
  </div>
</div>

<div id="modal" class="modal">
  <div class="head">
    <span>C++ export</span>
    <button id="mCopy">Copy</button>
    <button id="mClose" class="alt">Close</button>
  </div>
  <label>Name <input id="exportName" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="model"></label>
  <textarea id="exportText" readonly spellcheck="false"></textarea>
</div>
<div id="importModal" class="modal">
  <div class="head">
    <span>Import C++ array</span>
    <button id="iGo">Import</button>
    <button id="iClose" class="alt">Cancel</button>
  </div>
  <div class="note">Paste a previous export (the whole snippet, or just the numbers). Undo brings the old model back.</div>
  <textarea id="importText" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="static const float model_verts[] = { ... };"></textarea>
</div>
<div id="palModal" class="modal">
  <div class="head">
    <span>Palettes</span>
    <button id="pmClose" class="alt">Close</button>
  </div>
  <div class="note">Tap a palette to use it. The built-in one can't be changed or deleted: Duplicate it to make your own.</div>
  <div id="palList"></div>
  <div class="btnrow">
    <button id="pmNew" class="alt">New</button>
    <button id="pmDup" class="alt">Duplicate</button>
    <button id="pmRename" class="alt">Rename</button>
    <button id="pmDelete" class="alt">Delete</button>
  </div>
  <div class="btnrow">
    <button id="pmExport" class="alt">Export C++</button>
    <button id="pmImport" class="alt">Import</button>
  </div>
  <div id="palIO">
    <div class="head">
      <span id="palIOTitle"></span>
      <button id="pioCopy">Copy</button>
      <button id="pioGo">Import</button>
    </div>
    <textarea id="palText" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
  </div>
</div>
<div id="swModal" class="modal">
  <div class="card">
    <div class="head"><span id="swTitle">Swatch</span></div>
    <input id="swColor" type="color" value="#ff004d">
    <input id="swHex" type="text" maxlength="7" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="#rrggbb">
    <div class="btnrow">
      <button id="swSave">Save</button>
      <button id="swDelete" class="alt">Delete</button>
      <button id="swCancel" class="alt">Cancel</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";
// =====================================================================================
//  Vert Modeler v10 (the pofa modeler)
//  A tiny touch-first low-poly modeler. Every model starts as a cube; you can move
//  vertices (with an X/Y/Z axis gizmo), split edges, and paint faces, with optional live
//  mirror symmetry, then export a C++ array in exactly the format the pofa renderer
//  uploads, and paste it back in later with Import. A game rock sits beside the model
//  as a size reference (display only). Mirror never adds seam vertices on its own: the
//  centre cut only appears where you split an edge that crosses the plane. Dissolve
//  removes a vertex that sits on a flat area or straight edge (handy for old seams).
//  Vertices hidden behind the model (or off screen) are greyed out and can't be grabbed.
//  Tap a number in the X / Y / Z chip to type an exact coordinate. A quick tap on empty
//  space hides the editing overlay for a clean in-game preview. Colours come from named
//  palettes you can create, edit, export to C++, and import (Paint mode).
//
//  Coordinates match the game: Z is up, X is left/right, Y is forward/back, and models
//  sit with their base on z = 0. Rendering uses raw WebGL 2 (= OpenGL ES 3.0), so the
//  shaders (GLSL ES 3.00) and buffer/VAO calls are the same ones the game uses.
// =====================================================================================


//----- Constants -----||
const SAVE_KEY      = "pofa-modeler-v2";  // localStorage key for autosave
const OLD_SAVE_KEY  = "pofa-modeler-v1";  // v1 saves were Y-up; converted once on load
const TOUCH_RADIUS  = 24;                 // CSS px: how close a tap must be to a vertex/edge
const TAP_SLOP      = 8;                  // CSS px a finger may wiggle and still count as a tap
const SNAP_STEP     = 0.125;              // grid snap size in model units
const UNDO_LIMIT    = 100;                // max snapshots kept
const FOV_Y         = 50 * Math.PI / 180; // vertical field of view (radians)
const PLANE_TOL     = 1e-4;               // |coord| below this = vertex lies on the mirror plane
const PAIR_TOL      = 1e-3;               // max distance when auto-pairing mirror partners
const UP            = [0, 0, 1];          // Z-up world, like the game
const ROCK_KEY      = "pofa-modeler-rock";// separate key: just the rock on/off preference
const ROCK_OFFSET   = [1.25, 0, 0];       // where the reference rock sits (+X, beside the cube)
const GIZMO_PX      = 80;                 // CSS px: on-screen length of each axis handle
const GIZMO_TIP_PX  = 30;                 // CSS px: grab radius around a handle's tip ball
const GIZMO_SHAFT_PX= 18;                 // CSS px: grab distance from a handle's shaft
const WELD_EPS      = 1e-4;               // import: positions closer than this become one vertex
const AXIS_COLORS   = [[0.95, 0.30, 0.30], [0.35, 0.85, 0.40], [0.35, 0.55, 1.00]]; // X, Y, Z

// Baked light: fixed direction (toward the light) and the formula the export uses.
const BAKE_LIGHT    = normalize3([0.3, 0.5, 0.8]);
const bakeFactor    = (n) => 0.55 + 0.45 * Math.max(0, n[0]*BAKE_LIGHT[0] + n[1]*BAKE_LIGHT[1] + n[2]*BAKE_LIGHT[2]);

// Built-in palette (PICO-8 colours, 0..255). Faces store their own RGB (0..1 floats), so a
// palette is just a set of colours to paint with; changing palettes never recolours a model.
const PALETTE = [
  [  0,  0,  0], [ 29, 43, 83], [126, 37, 83], [  0,135, 81],
  [171, 82, 54], [ 95, 87, 79], [194,195,199], [255,241,232],
  [255,  0, 77], [255,163,  0], [255,236, 39], [  0,228, 54],
  [ 41,173,255], [131,118,156], [255,119,168], [255,204,170],
];
// Palette colours are kept at 3 decimals, the same precision the C++ export prints, so a
// palette exported and imported again comes back identical.
const round3 = (x) => Math.round(x * 1000) / 1000;
const DEFAULT_PALETTE = PALETTE.map(c => c.map(v => round3(v / 255)));
const colorEq = (a, b, eps = 1e-6) => Math.abs(a[0]-b[0]) <= eps && Math.abs(a[1]-b[1]) <= eps && Math.abs(a[2]-b[2]) <= eps;


//----- Small Vector Math -----||
// Vectors are plain [x, y, z] arrays. Kept tiny on purpose so every line is readable.
function normalize3(a) { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; }
const v3 = {
  sub:   (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]],
  add:   (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]],
  scale: (a, s) => [a[0]*s, a[1]*s, a[2]*s],
  dot:   (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2],
  cross: (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]],
  len:   (a)    => Math.hypot(a[0], a[1], a[2]),
  norm:  normalize3,
};


//----- Matrix Math (column-major, like OpenGL) -----||
// Element (row r, column c) lives at m[c*4 + r].
function mat4Multiply(a, b) {
  const out = new Float32Array(16);
  for (let c = 0; c < 4; c++)
    for (let r = 0; r < 4; r++) {
      let s = 0;
      for (let k = 0; k < 4; k++) s += a[k*4 + r] * b[c*4 + k];
      out[c*4 + r] = s;
    }
  return out;
}

// Standard OpenGL perspective projection (same as glm::perspective).
function mat4Perspective(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2);
  const m = new Float32Array(16);
  m[0]  = f / aspect;
  m[5]  = f;
  m[10] = (far + near) / (near - far);
  m[11] = -1;
  m[14] = (2 * far * near) / (near - far);
  return m;
}

// Camera matrix looking from eye toward target (same as glm::lookAt). Passing up = +Z
// makes the camera treat Z as "up", so we can draw the Z-up world directly without the
// game's (x, z, -y) remap. Both are rotations, so the picture and the winding are the same.
function mat4LookAt(eye, target, up) {
  const z = v3.norm(v3.sub(eye, target)); // camera looks down its own -z
  const x = v3.norm(v3.cross(up, z));
  const y = v3.cross(z, x);
  return new Float32Array([
    x[0], y[0], z[0], 0,
    x[1], y[1], z[1], 0,
    x[2], y[2], z[2], 0,
    -v3.dot(x, eye), -v3.dot(y, eye), -v3.dot(z, eye), 1,
  ]);
}


//----- Mesh Data -----||
// Struct-of-arrays, just like the game's data:
//   positions : flat [x0,y0,z0, x1,y1,z1, ...]  (3 floats per vertex, Z-up)
//   tris      : flat [a0,b0,c0, a1,b1,c1, ...]  (3 vertex indices per triangle, CCW from outside)
//   colors    : [[r,g,b], ...]                    (one colour per triangle, floats 0..1, unlit)
//   partner   : [p0, p1, ...]                     (mirror partner per vertex: other index,
//                                                  itself if it lies on the plane, -1 if none)
//   mirror    : "x" | "y" | null                  (mirror axis; the plane is axis = 0)
// Everything lives in this one object, so undo snapshots and autosave capture it all.
let mesh = null;   // set by newModel("x") at startup, once everything below is defined

// New model: always the plain cube (8 verts, 12 tris), mirror on or off. With mirror on,
// its corners pair up by position (each corner's reflection is another corner). Nothing
// is cut along the plane: a centre cut only appears where you split a crossing edge.
function newModel(mirror) {
  mesh = makeCube(mirror);
}

function makeCube(mirror = null) {
  const h = 0.5; // unit cube: x,y from -0.5 to +0.5, z from 0 to 1 (base on the ground)
  const positions = [
    -h,-h, 0,   h,-h, 0,   h, h, 0,  -h, h, 0,   // 0..3 bottom (z = 0)
    -h,-h, 1,   h,-h, 1,   h, h, 1,  -h, h, 1,   // 4..7 top    (z = 1)
  ];
  // Each side as a quad listed counter-clockwise when seen from OUTSIDE,
  // then cut into 2 triangles (q0,q1,q2) and (q0,q2,q3).
  const quads = [
    [4, 5, 6, 7],   // top    +z (seen from above: x right, y up)
    [0, 3, 2, 1],   // bottom -z
    [0, 1, 5, 4],   // front  -y
    [2, 3, 7, 6],   // back   +y
    [1, 2, 6, 5],   // right  +x
    [3, 0, 4, 7],   // left   -x
  ];
  const tris = [];
  for (const q of quads) tris.push(q[0], q[1], q[2],  q[0], q[2], q[3]);
  const m = { positions, tris, colors: Array.from({ length: 12 }, () => DEFAULT_PALETTE[6].slice()), partner: new Array(8).fill(-1), mirror };
  pairMirror(m);
  return m;
}

const vertCount = () => mesh.positions.length / 3;
const triCount  = () => mesh.tris.length / 3;
const getVert   = (i) => [mesh.positions[i*3], mesh.positions[i*3+1], mesh.positions[i*3+2]];
function setVert(i, p) { mesh.positions[i*3] = p[0]; mesh.positions[i*3+1] = p[1]; mesh.positions[i*3+2] = p[2]; }

// Face normal of triangle t: cross product of two edges, normalised.
function triNormal(t) {
  const a = getVert(mesh.tris[t*3]), b = getVert(mesh.tris[t*3+1]), c = getVert(mesh.tris[t*3+2]);
  return v3.norm(v3.cross(v3.sub(b, a), v3.sub(c, a)));
}

// Colour of triangle t as 0..1 floats, with baked light if "Shade" is on.
function triColor(t) {
  const k = bakeOn ? bakeFactor(triNormal(t)) : 1;
  return mesh.colors[t].map(c => Math.min(1, c * k));
}

// Unique edges as [a, b] pairs (a < b). Each edge is shared by up to 2 triangles.
function uniqueEdges() {
  const seen = new Set(), edges = [];
  for (let t = 0; t < triCount(); t++)
    for (let k = 0; k < 3; k++) {
      let a = mesh.tris[t*3 + k], b = mesh.tris[t*3 + (k+1) % 3];
      if (a > b) [a, b] = [b, a];
      const key = a + "," + b;
      if (!seen.has(key)) { seen.add(key); edges.push([a, b]); }
    }
  return edges;
}

function edgeExists(a, b) {
  for (let t = 0; t < triCount(); t++)
    for (let k = 0; k < 3; k++) {
      const p = mesh.tris[t*3 + k], q = mesh.tris[t*3 + (k+1) % 3];
      if ((p === a && q === b) || (p === b && q === a)) return true;
    }
  return false;
}

// Split edge (a,b): add a vertex m at its midpoint, then replace every triangle that
// uses that edge with two triangles. For triangle (x, y, z) where x->y is the edge,
// the halves are (x, m, z) and (m, y, z), which keeps the original winding.
// t = where along a->b the new vertex goes (0.5 = midpoint).
function splitEdge(a, b, t = 0.5) {
  const m = vertCount();
  const pa = getVert(a), pb = getVert(b);
  mesh.positions.push(pa[0] + (pb[0]-pa[0])*t, pa[1] + (pb[1]-pa[1])*t, pa[2] + (pb[2]-pa[2])*t);
  mesh.partner.push(-1);

  const newTris = [], newColors = [];
  for (let t = 0; t < triCount(); t++) {
    const v = mesh.tris.slice(t*3, t*3 + 3);
    let k = -1;
    for (let i = 0; i < 3; i++) {
      const p = v[i], q = v[(i+1) % 3];
      if ((p === a && q === b) || (p === b && q === a)) k = i;
    }
    if (k < 0) { newTris.push(...v); newColors.push(mesh.colors[t]); continue; }
    const x = v[k], y = v[(k+1) % 3], z = v[(k+2) % 3];
    newTris.push(x, m, z,  m, y, z);
    newColors.push(mesh.colors[t], mesh.colors[t]);
  }
  mesh.tris = newTris;
  mesh.colors = newColors;
  return m;
}


//----- Mirror Symmetry -----||
// The mirror plane passes through the origin, perpendicular to the chosen axis:
//   "x" -> plane x = 0, left/right symmetry     "y" -> plane y = 0, forward/back symmetry
// (A function declaration, not an arrow const, so makeCube() can use it before this line runs.)
function axisIndex(axis) { return axis === "x" ? 0 : axis === "y" ? 1 : -1; }

// Reflect a point across the mirror plane (flip the sign of one coordinate).
function reflect(p, ax) { const q = p.slice(); q[ax] = -q[ax]; return q; }

// Find a partner for every vertex of mesh `m` from positions alone:
//   on the plane          -> partner is itself (and the coordinate is snapped to exactly 0)
//   mirrored twin nearby  -> partner is the twin (closest within PAIR_TOL)
//   otherwise             -> -1 (unpaired; moves on its own until you Symmetrize)
// Returns the number of unpaired vertices.
function pairMirror(m) {
  const n = m.positions.length / 3;
  m.partner = new Array(n).fill(-1);
  const ax = axisIndex(m.mirror);
  if (ax < 0) return 0;
  const P = m.positions;
  for (let i = 0; i < n; i++)
    if (Math.abs(P[i*3 + ax]) < PLANE_TOL) { P[i*3 + ax] = 0; m.partner[i] = i; }
  for (let i = 0; i < n; i++) {
    if (m.partner[i] >= 0) continue;
    const want = reflect([P[i*3], P[i*3+1], P[i*3+2]], ax);
    let best = -1, bestD = PAIR_TOL;
    for (let j = 0; j < n; j++) {
      if (j === i || m.partner[j] >= 0) continue;
      const d = Math.hypot(P[j*3] - want[0], P[j*3+1] - want[1], P[j*3+2] - want[2]);
      if (d < bestD) { best = j; bestD = d; }
    }
    if (best >= 0) { m.partner[i] = best; m.partner[best] = i; }
  }
  return m.partner.filter(p => p < 0).length;
}

const unpairedCount = () => axisIndex(mesh.mirror) < 0 ? 0 : mesh.partner.filter(p => p < 0).length;

// Move vertex i to p, keeping symmetry: a plane vertex stays on the plane, and a paired
// vertex drags its partner along to the mirrored spot.
function moveVertex(i, p) {
  const ax = axisIndex(mesh.mirror);
  const q = mesh.partner[i];
  if (ax >= 0 && q === i) p[ax] = 0;               // locked to the plane on that axis
  setVert(i, p);
  if (ax >= 0 && q >= 0 && q !== i) setVert(q, reflect(p, ax));
}

// Split edge (a,b) with mirror rules:
//  - Edge crosses the plane (one end on each side): the new vertex goes exactly where the
//    edge meets the plane, not at the tap or the raw midpoint, so it's its own twin. This
//    is the only way a centre cut appears, and only on the edge you tapped.
//  - Edge lies in the plane: midpoint, also on the plane, its own twin.
//  - Otherwise: split it at the midpoint, and also split its twin edge (the edge between
//    the two endpoints' partners) if there is one, pairing the two new vertices.
//  - Unpaired endpoints: just split this edge (nothing to mirror).
function splitEdgeMirrored(a, b) {
  const ax = axisIndex(mesh.mirror);
  if (ax < 0) return splitEdge(a, b);
  const ca = mesh.positions[a*3 + ax], cb = mesh.positions[b*3 + ax];
  const crosses = (ca > PLANE_TOL && cb < -PLANE_TOL) || (ca < -PLANE_TOL && cb > PLANE_TOL);
  if (crosses) {
    const m = splitEdge(a, b, ca / (ca - cb));
    mesh.positions[m*3 + ax] = 0;
    mesh.partner[m] = m;
    return m;
  }
  const m = splitEdge(a, b);
  if (Math.abs(ca) < PLANE_TOL && Math.abs(cb) < PLANE_TOL) {
    mesh.positions[m*3 + ax] = 0;
    mesh.partner[m] = m;
    return m;
  }
  const pa = mesh.partner[a], pb = mesh.partner[b];
  if (pa < 0 || pb < 0) return m;                  // unpaired edge: no mirror to split
  if (edgeExists(pa, pb)) {
    const m2 = splitEdge(pa, pb);
    mesh.partner[m] = m2; mesh.partner[m2] = m;
    setVert(m2, reflect(getVert(m), ax));          // exact mirror, no float drift
  }
  return m;
}

// Topological mirror of triangle t: the triangle made of the partners of t's three
// vertices, or -1. Can be t itself for a triangle that straddles the plane symmetrically.
function topoMirror(t) {
  if (axisIndex(mesh.mirror) < 0) return -1;
  const want = [0, 1, 2].map(k => mesh.partner[mesh.tris[t*3 + k]]);
  if (want.some(p => p < 0)) return -1;
  const key = want.sort((a, b) => a - b).join(",");
  for (let u = 0; u < triCount(); u++)
    if (mesh.tris.slice(u*3, u*3 + 3).sort((a, b) => a - b).join(",") === key) return u;
  return -1;
}

// "Folded" triangles: no topological twin AND their reflection doesn't lie on the surface.
// A flat quad that crosses the plane with one diagonal is fine (its two halves aren't
// twins, but the reflected shape is the same flat face). Once you pull its corners out of
// that plane, the single diagonal makes a crease that isn't symmetric: that's a fold, and
// the fix is to split one of its crossing edges (or Symm). Shown as a hint in the info bar.
function foldedTriCount() {
  const ax = axisIndex(mesh.mirror);
  if (ax < 0) return 0;
  let n = 0;
  for (let t = 0; t < triCount(); t++) {
    if (topoMirror(t) >= 0) continue;
    const P = [0, 1, 2].map(k => getVert(mesh.tris[t*3 + k]));
    const cen = v3.scale(v3.add(P[0], v3.add(P[1], P[2])), 1 / 3);
    const samples = [cen, ...P.map(p => v3.add(v3.scale(cen, 0.5), v3.scale(p, 0.5)))];
    const onSurface = samples.every(sp => {
      const q = reflect(sp, ax);
      for (let w = 0; w < triCount(); w++)
        if (pointTriDist(q, getVert(mesh.tris[w*3]), getVert(mesh.tris[w*3+1]), getVert(mesh.tris[w*3+2])) < 1e-3) return true;
      return false;
    });
    if (!onSurface) n++;
  }
  return n;
}

// Which triangles should be painted along with t? Returns an array (maybe empty).
//  1. The topological mirror, if there is one (the normal case after Symmetrize).
//  2. Fallback: a quad that crosses the plane but is split by ONE diagonal has two
//     triangles that aren't mirror images. Then reflect a few sample points of t and
//     take the triangle nearest to each, so the paint still comes out symmetric.
function mirroredTris(t) {
  const ax = axisIndex(mesh.mirror);
  if (ax < 0) return [];
  const u = topoMirror(t);
  if (u >= 0) return [u];
  const P = [0, 1, 2].map(k => getVert(mesh.tris[t*3 + k]));
  const cen = v3.scale(v3.add(P[0], v3.add(P[1], P[2])), 1 / 3);
  const samples = [cen, ...P.map(p => v3.add(v3.scale(cen, 0.7), v3.scale(p, 0.3)))];
  const found = new Set();
  for (const sp of samples) {
    const q = reflect(sp, ax);
    let best = -1, bestD = 0.1;                    // ignore anything further than 0.1 units
    for (let w = 0; w < triCount(); w++) {
      const d = pointTriDist(q, getVert(mesh.tris[w*3]), getVert(mesh.tris[w*3+1]), getVert(mesh.tris[w*3+2]));
      if (d < bestD) { best = w; bestD = d; }
    }
    if (best >= 0) found.add(best);
  }
  return [...found];
}

// 3D distance from point p to segment a-b.
function segDist(p, a, b) {
  const ab = v3.sub(b, a), l2 = v3.dot(ab, ab);
  const t = l2 ? Math.max(0, Math.min(1, v3.dot(v3.sub(p, a), ab) / l2)) : 0;
  return v3.len(v3.sub(p, v3.add(a, v3.scale(ab, t))));
}

// 3D distance from point p to triangle abc: if p projects inside the triangle it's the
// distance to the triangle's plane, otherwise the distance to the nearest edge.
function pointTriDist(p, a, b, c) {
  const nRaw = v3.cross(v3.sub(b, a), v3.sub(c, a));
  if (v3.len(nRaw) < 1e-12) return Math.min(segDist(p, a, b), segDist(p, b, c), segDist(p, c, a));
  const n = v3.norm(nRaw);
  const d = v3.dot(n, v3.sub(p, a));
  const q = v3.sub(p, v3.scale(n, d));             // p dropped onto the plane
  const inside = v3.dot(n, v3.cross(v3.sub(b, a), v3.sub(q, a))) >= 0 &&
                 v3.dot(n, v3.cross(v3.sub(c, b), v3.sub(q, b))) >= 0 &&
                 v3.dot(n, v3.cross(v3.sub(a, c), v3.sub(q, c))) >= 0;
  return inside ? Math.abs(d) : Math.min(segDist(p, a, b), segDist(p, b, c), segDist(p, c, a));
}

// Symmetrize: throw away the minus side and rebuild it as a mirror copy of the plus side.
//  1. Clip every triangle to the half-space axis >= 0. Triangles that cross the plane are
//     cut, with new vertices where their edges cross it (shared between neighbours).
//  2. Keep only vertices still in use, snap plane vertices to exactly 0.
//  3. Copy each off-plane vertex to its reflected position, and add every triangle again
//     with reflected vertices and reversed winding (a reflection flips CCW to CW).
// Returns false if there was nothing on the plus side.
function symmetrize() {
  const ax = axisIndex(mesh.mirror);
  if (ax < 0) return false;
  const pos = mesh.positions.slice();
  const side = (i) => { const c = pos[i*3 + ax]; return Math.abs(c) < PLANE_TOL ? 0 : c; };
  const cutCache = new Map();
  function cutVertex(a, b) {                        // where edge a-b crosses the plane
    const key = Math.min(a, b) + "," + Math.max(a, b);
    if (cutCache.has(key)) return cutCache.get(key);
    const ca = pos[a*3 + ax], cb = pos[b*3 + ax], t = ca / (ca - cb);
    const p = [0, 1, 2].map(k => pos[a*3 + k] + (pos[b*3 + k] - pos[a*3 + k]) * t);
    p[ax] = 0;
    const idx = pos.length / 3;
    pos.push(...p);
    cutCache.set(key, idx);
    return idx;
  }

  // 1. clip (Sutherland-Hodgman against one plane), then fan-triangulate the polygon
  const keptTris = [], keptColors = [];
  for (let t = 0; t < triCount(); t++) {
    const v = mesh.tris.slice(t*3, t*3 + 3);
    if (v.every(i => side(i) === 0)) continue;     // lies flat in the plane: would double up
    const poly = [];
    for (let k = 0; k < 3; k++) {
      const cur = v[k], nxt = v[(k+1) % 3];
      const sc = side(cur), sn = side(nxt);
      if (sc >= 0) poly.push(cur);
      if ((sc > 0 && sn < 0) || (sc < 0 && sn > 0)) poly.push(cutVertex(cur, nxt));
    }
    for (let j = 1; j + 1 < poly.length; j++) {
      keptTris.push(poly[0], poly[j], poly[j+1]);
      keptColors.push(mesh.colors[t]);
    }
  }
  if (!keptTris.length) return false;

  // 2. compact the vertices that are still used
  const remap = new Map(), positions = [], partner = [];
  for (const i of keptTris) {
    if (remap.has(i)) continue;
    remap.set(i, positions.length / 3);
    const p = [pos[i*3], pos[i*3+1], pos[i*3+2]];
    if (Math.abs(p[ax]) < PLANE_TOL) p[ax] = 0;
    positions.push(...p);
    partner.push(-1);
  }

  // 3. mirror the vertices and the triangles
  const nKept = positions.length / 3;
  for (let i = 0; i < nKept; i++) {
    const p = positions.slice(i*3, i*3 + 3);
    if (p[ax] === 0) { partner[i] = i; continue; }
    const j = positions.length / 3;
    positions.push(...reflect(p, ax));
    partner.push(i);
    partner[i] = j;
  }
  const tris = keptTris.map(i => remap.get(i));
  const colors = keptColors.slice();
  const nTris = tris.length / 3;
  for (let t = 0; t < nTris; t++) {
    const a = partner[tris[t*3]], b = partner[tris[t*3+1]], c = partner[tris[t*3+2]];
    tris.push(a, c, b);                            // reversed winding
    colors.push(colors[t]);
  }
  mesh = { positions, tris, colors, partner, mirror: mesh.mirror };
  return true;
}


//----- Dissolve -----||
// Remove vertex v and fill the hole with new triangles, without changing the shape.
// Allowed only when that's possible:
//  - Its surrounding triangles form a closed fan (v isn't on an open border).
//  - Group the fan into runs of triangles that share a plane AND a colour. Then either
//    1 group  : v sits inside a flat, single-colour area  -> re-fill the whole ring, or
//    2 groups : v sits on a straight crease/colour border  -> the two border edges v-a and
//               v-b must be exactly in line (a, v, b collinear); re-fill each side.
//    3+ groups: v is a real corner -> refuse.
// Each hole is filled by ear clipping in the face's plane (keeps CCW winding).
// Returns { tris, colors, ring } of the replacement, or a string saying why not.
const DISSOLVE_TOL = 1e-4;

function dissolvePlan(v) {
  const fan = [];
  for (let t = 0; t < triCount(); t++) {
    const tri = mesh.tris.slice(t*3, t*3 + 3), k = tri.indexOf(v);
    if (k >= 0) fan.push({ t, x: tri[(k+1) % 3], y: tri[(k+2) % 3] });   // (v, x, y) CCW
  }
  if (fan.length < 2) return "not enough faces around it";
  // Order the fan: each triangle's y is the next triangle's x.
  const byX = new Map();
  for (const f of fan) { if (byX.has(f.x)) return "the faces around it overlap"; byX.set(f.x, f); }
  const ring = [];
  let f = fan[0];
  for (let i = 0; i < fan.length; i++) {
    ring.push(f);
    f = byX.get(f.y);
    if (!f) return "it's on an open edge";
  }
  if (f !== fan[0]) return "the faces around it aren't one fan";
  // Group consecutive triangles by plane + colour.
  const nrm = (r) => triNormal(r.t), same = (r, q) =>
    colorEq(mesh.colors[r.t], mesh.colors[q.t]) && v3.dot(nrm(r), nrm(q)) > 1 - 1e-6;
  const cuts = [];                                 // ring index where a new group starts
  for (let i = 0; i < ring.length; i++) if (!same(ring[(i + ring.length - 1) % ring.length], ring[i])) cuts.push(i);
  const P = getVert(v);
  let polys = [];                                  // [{ verts:[...], n, color }]
  if (cuts.length === 0) {
    polys.push({ verts: ring.map(r => r.x), n: nrm(ring[0]), color: mesh.colors[ring[0].t] });
  } else if (cuts.length === 2) {
    const a = ring[cuts[0]].x, b = ring[cuts[1]].x;
    const da = v3.sub(getVert(a), P), db = v3.sub(getVert(b), P);
    const straight = v3.len(v3.cross(da, db)) <= DISSOLVE_TOL * v3.len(da) * v3.len(db) && v3.dot(da, db) < 0;
    if (!straight) return "it's a corner (its edges aren't in a straight line)";
    for (const [s0, s1] of [[cuts[0], cuts[1]], [cuts[1], cuts[0] + ring.length]]) {
      const run = [];
      for (let i = s0; i < s1; i++) run.push(ring[i % ring.length]);
      polys.push({ verts: [...run.map(r => r.x), run[run.length - 1].y], n: nrm(run[0]), color: mesh.colors[run[0].t] });
    }
  } else return "it's a corner (it joins " + Math.max(cuts.length, 3) + " flat areas)";
  const tris = [], colors = [];
  for (const poly of polys) {
    const out = earClip(poly.verts, poly.n);
    if (!out) return "the hole couldn't be filled cleanly";
    for (let i = 0; i < out.length; i += 3) { tris.push(out[i], out[i+1], out[i+2]); colors.push(poly.color); }
  }
  return { remove: ring.map(r => r.t), tris, colors };
}

// Ear clipping for a flat polygon (vertex indices, CCW around normal n). Returns flat
// triangle indices, or null if it gets stuck. Skips zero-area ears when it can, so
// straight runs of vertices don't produce sliver triangles.
function earClip(poly, n) {
  const idx = poly.slice(), out = [];
  const area = (a, b, c) => v3.dot(n, v3.cross(v3.sub(getVert(b), getVert(a)), v3.sub(getVert(c), getVert(a))));
  // Inclusive: a vertex lying exactly on the new diagonal also blocks the ear (no T-junctions).
  const inside = (p, a, b, c) => area(a, b, p) >= -1e-9 && area(b, c, p) >= -1e-9 && area(c, a, p) >= -1e-9;
  while (idx.length > 3) {
    let cut = -1;
    for (let i = 0; i < idx.length && cut < 0; i++) {
      const a = idx[(i + idx.length - 1) % idx.length], b = idx[i], c = idx[(i + 1) % idx.length];
      if (area(a, b, c) <= 1e-9) continue;          // reflex or straight: not an ear
      if (idx.some(p => p !== a && p !== b && p !== c && inside(p, a, b, c))) continue;
      cut = i;
    }
    if (cut < 0) return null;
    const a = idx[(cut + idx.length - 1) % idx.length], b = idx[cut], c = idx[(cut + 1) % idx.length];
    out.push(a, b, c);
    idx.splice(cut, 1);
  }
  if (area(idx[0], idx[1], idx[2]) <= 1e-9) return null;
  out.push(idx[0], idx[1], idx[2]);
  return out;
}

// Dissolve v, and with mirror on also its twin (using the mirrored re-fill when the
// twin's faces are the exact mirror of v's, so the result stays symmetric). Unused
// vertices are then removed and indices renumbered. Returns true or a reason string.
function dissolveVertex(v) {
  const plan = dissolvePlan(v);
  if (typeof plan === "string") return plan;
  const ax = axisIndex(mesh.mirror), q = mesh.partner[v];
  let twin = null;
  if (ax >= 0 && q >= 0 && q !== v) {
    const mirroredRemove = plan.remove.map(topoMirror);
    let qFan = 0;
    for (let t = 0; t < triCount(); t++) if (mesh.tris.slice(t*3, t*3 + 3).includes(q)) qFan++;
    const ok = mirroredRemove.every(u => u >= 0) && new Set(mirroredRemove).size === qFan &&
               plan.tris.every(i => mesh.partner[i] >= 0);
    if (ok) {
      const tris = [];
      for (let i = 0; i < plan.tris.length; i += 3)   // reflected triangle = reversed winding
        tris.push(mesh.partner[plan.tris[i]], mesh.partner[plan.tris[i+2]], mesh.partner[plan.tris[i+1]]);
      twin = { remove: mirroredRemove, tris, colors: plan.colors.slice() };
    } else {
      twin = dissolvePlan(q);
      if (typeof twin === "string") return "its mirror twin can't go: " + twin;
    }
  }
  const drop = new Set([...plan.remove, ...(twin ? twin.remove : [])]);
  const tris = [], colors = [];
  for (let t = 0; t < triCount(); t++) {
    if (drop.has(t)) continue;
    tris.push(...mesh.tris.slice(t*3, t*3 + 3)); colors.push(mesh.colors[t]);
  }
  for (const pl of twin ? [plan, twin] : [plan]) { tris.push(...pl.tris); colors.push(...pl.colors); }
  // Compact: keep only vertices still used, renumber triangles and partners.
  const used = new Set(tris), remap = new Map(), positions = [];
  for (let i = 0; i < vertCount(); i++)
    if (used.has(i)) { remap.set(i, positions.length / 3); positions.push(...getVert(i)); }
  const partner = [];
  for (let i = 0; i < vertCount(); i++)
    if (used.has(i)) { const p = mesh.partner[i]; partner.push(p >= 0 && remap.has(p) ? remap.get(p) : -1); }
  mesh = { positions, tris: tris.map(i => remap.get(i)), colors, partner, mirror: mesh.mirror };
  return true;
}


//----- Reference Rock (display only) -----||
// A straight port of the rock generator in pofa's src/render/render.cpp, render_init()
// (the P0/M0/T0 tables, jitter(), and the loop `for (uint32_t s = 0; s < ROCK_SHAPES; s++)`),
// for shape s = 0: seed 1000, scale 1.0, the smallest rock in the game. Positions are game
// world units (Z-up, base on z = 0), the same units the modeler edits and exports 1:1.
// Colours are the game's own (no baked light; the game shader doesn't light them either).
// It is NOT part of `mesh`: never picked, edited, exported, undone, or autosaved.
const f32 = Math.fround;   // C float maths is 32-bit; round every step like the game does

// jitter(): hash (seed, i) to a float in [-mag, +mag]. uint32 overflow via Math.imul + >>> 0.
function rockJitter(seed, i, mag) {
  seed = (seed ^ Math.imul(i, 0x9E3779B9)) >>> 0;
  seed = Math.imul(seed, 747796405) >>> 0;
  const u = f32((seed >>> 8) * f32(1 / 16777215));
  return f32(f32(f32(u * 2) - 1) * f32(mag));
}

function buildGameRock(s = 0) {
  const P0 = [[-0.40,-0.28,0.00],[0.12,-0.50,0.00],[0.48,-0.18,0.00],[0.38,0.35,0.00],[-0.08,0.48,0.00],[-0.45,0.12,0.00]];
  const M0 = [[-0.35,-0.32,0.20],[0.18,-0.42,0.24],[0.50,-0.08,0.22],[0.32,0.38,0.26],[-0.05,0.44,0.23],[-0.42,0.08,0.25]];
  const T0 = [0.02, 0.03, 0.40];
  const colBot = [0.28, 0.27, 0.25], colTop = [0.62, 0.60, 0.55];
  const sideGreys = [[0.35,0.34,0.32],[0.40,0.38,0.36],[0.42,0.41,0.38],[0.46,0.44,0.41],[0.48,0.46,0.43],[0.52,0.50,0.47]];
  const scales = [1.0, 1.18, 2.25, 2.25, 3.9, 3.9];
  const seed = 1000 + s * 17, J = rockJitter, add = (a, b) => f32(f32(a) + b);
  const P = [], M = [], N = [];
  for (let i = 0; i < 6; i++) {
    P.push([add(P0[i][0], J(seed, i*3 + 0, 0.10)), add(P0[i][1], J(seed, i*3 + 1, 0.10)), 0]);
    const m = [add(M0[i][0], J(seed, 20 + i*3 + 0, 0.12)), add(M0[i][1], J(seed, 20 + i*3 + 1, 0.12)),
               add(M0[i][2], J(seed, 20 + i*3 + 2, 0.08))];
    if (m[2] < f32(0.12)) m[2] = f32(0.12);
    M.push(m);
  }
  const T = [add(T0[0], J(seed, 90, 0.06)), add(T0[1], J(seed, 91, 0.06)), add(T0[2], J(seed, 92, 0.05))];
  T[2] = Math.min(f32(0.48), Math.max(f32(0.32), T[2]));
  for (let i = 0; i < 6; i++)
    N.push([f32(M[i][0] * f32(0.45)), f32(M[i][1] * f32(0.45)), add(0.34, J(seed, 40 + i, 0.04))]);
  const sc = f32(scales[s]);
  for (const p of [...P, ...M, ...N, T]) for (let k = 0; k < 3; k++) p[k] = f32(p[k] * sc);
  const out = [];
  const tri = (a, b, c, col) => { for (const q of [a, b, c]) out.push(q[0], q[1], q[2], col[0], col[1], col[2]); };
  tri(P[0], P[1], P[2], colBot); tri(P[0], P[2], P[3], colBot);
  tri(P[0], P[3], P[4], colBot); tri(P[0], P[4], P[5], colBot);
  for (let i = 0; i < 6; i++) {
    const j = (i + 1) % 6, side = sideGreys[(s + i) % 6];
    tri(P[i], P[j], M[j], side);   tri(P[i], M[j], M[i], side);
    tri(M[i], M[j], N[j], colTop); tri(M[i], N[j], N[i], colTop);
    tri(N[i], N[j], T, colTop);
  }
  return out;   // 34 triangles = 102 verts x 6 floats, same layout as the export
}

const GAME_ROCK = buildGameRock(0);
// Bounding box of the rock (for the toast): [min xyz, max xyz] in world units.
const ROCK_BOUNDS = (() => {
  const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
  for (let i = 0; i < GAME_ROCK.length; i += 6)
    for (let k = 0; k < 3; k++) { lo[k] = Math.min(lo[k], GAME_ROCK[i+k]); hi[k] = Math.max(hi[k], GAME_ROCK[i+k]); }
  return [lo, hi];
})();


//----- App State -----||
let mode         = "move";  // "move" | "split" | "paint"
let snapOn       = false;
let bakeOn       = true;    // bake light into face colours (preview + export)

let overlayOn    = true;    // false = clean preview: no dots, edges, gizmo, or mirror plane

let selExtra     = new Set(); // the other selected vertices (multi-select); empty if selected < 0
